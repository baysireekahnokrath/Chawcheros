<style>
/* Layout: one phone-width column, sticky top bar, thumb-zone actions pinned to the bottom. Earth tones: oat ground, teak-green accent, walnut secondary. */
:root{
  --bg:#E6E1D8; --surface:#F6F3EE; --raised:#FFFDF9; --ink:#2A2520; --muted:#6B6258; --line:#D6CEC2;
  --accent:#3D5A4B; --accent-ink:#F5F2EC; --accent-soft:#DCE5DD;
  --walnut:#7A583C; --walnut-soft:#EDE2D6;
  --warn:#A65F14; --warn-bg:#F5E3CB; --danger:#97352A; --danger-bg:#F2DAD4; --on-danger:#FFFFFF; --ok:#3B7350; --ok-bg:#DBE9DE;
  --shadow:0 1px 2px rgba(42,37,32,.08),0 6px 18px rgba(42,37,32,.08);
  --f-display:"Noto Serif Thai",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai",Tahoma,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191714; --surface:#221F1B; --raised:#2B2722; --ink:#EEE7DC; --muted:#A79C8E; --line:#3B352E;
  --accent:#8DB49C; --accent-ink:#14201A; --accent-soft:#2A3A31;
  --walnut:#C9A07A; --walnut-soft:#3A2F25;
  --warn:#E3A35A; --warn-bg:#3D2C17; --danger:#E58C7E; --danger-bg:#41231E; --on-danger:#2A0F0B; --ok:#8CC49F; --ok-bg:#1F3326;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#191714; --surface:#221F1B; --raised:#2B2722; --ink:#EEE7DC; --muted:#A79C8E; --line:#3B352E;
  --accent:#8DB49C; --accent-ink:#14201A; --accent-soft:#2A3A31;
  --walnut:#C9A07A; --walnut-soft:#3A2F25;
  --warn:#E3A35A; --warn-bg:#3D2C17; --danger:#E58C7E; --danger-bg:#41231E; --on-danger:#2A0F0B; --ok:#8CC49F; --ok-bg:#1F3326;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);display:flex;flex-direction:column;position:relative}
.mockbar{background:var(--walnut-soft);color:var(--walnut);font-size:13px;padding:6px 16px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.mockbar button{background:none;border:0;color:inherit;text-decoration:underline;font-size:13px;padding:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.top h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.top .sub{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.back{border:0;background:var(--raised);border-radius:12px;width:44px;height:44px;font-size:22px;flex:none;box-shadow:var(--shadow)}
.sync{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.sync.pending .dot{background:var(--warn)}
main{flex:1;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
.hello{font-family:var(--f-display);font-size:26px;margin:4px 0 0;font-weight:600}
.date{color:var(--muted);margin-top:-12px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border:0;border-radius:18px;min-height:112px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:19px;font-weight:600;line-height:1.3;box-shadow:var(--shadow)}
.bigbtn small{font-weight:400;font-size:14px;opacity:.85}
.bigbtn.a{background:var(--accent);color:var(--accent-ink)}
.bigbtn.b{background:var(--walnut);color:var(--accent-ink)}
.sec-h{font-size:14px;letter-spacing:.06em;color:var(--muted);margin:8px 0 -6px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h button{border:0;background:none;color:var(--accent);font-size:15px;padding:6px}
.card{background:var(--raised);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
button.card{min-height:64px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row > *{min-width:0}
.name{font-family:var(--f-display);font-size:19px;font-weight:600}
.meta{color:var(--muted);font-size:15px}
.time{font-family:var(--f-num);font-size:17px;color:var(--walnut);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.soft{background:var(--accent-soft);color:var(--accent)}
.pill.wal{background:var(--walnut-soft);color:var(--walnut)}
.status{display:flex;gap:10px;flex-wrap:wrap}
.statbtn{flex:1 1 140px;border:0;border-radius:var(--r);padding:12px 14px;text-align:left;background:var(--raised);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;min-height:64px}
.statbtn b{font-family:var(--f-num);font-size:24px}
.statbtn.warn b{color:var(--warn)} .statbtn.danger b{color:var(--danger)}
.ghost{border:1.5px dashed var(--line);background:none;border-radius:var(--r);min-height:56px;color:var(--muted);font-size:16px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--raised);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav button{border:0;background:none;min-height:66px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav .ico{font-size:22px;line-height:1}
.badge{position:absolute;top:8px;left:calc(50% + 8px);background:var(--danger);color:var(--on-danger);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-num)}

/* visit */
.banner{padding:10px 16px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;border:0;width:100%;text-align:left}
.banner.b4{background:var(--danger);color:var(--on-danger)}
.banner.a6{background:var(--warn-bg);color:var(--warn)}
.steps{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;border:1.5px solid var(--line);background:var(--raised);border-radius:12px;min-width:58px;height:52px;font-family:var(--f-num);font-size:16px;position:relative}
.step[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.step.touched::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.step.hot{border-color:var(--warn);color:var(--warn)}
.step.hot[aria-current="step"]{background:var(--warn);color:var(--raised)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;border-radius:9px;min-height:44px;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.stepcard{background:var(--raised);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.stepcard.hot{outline:3px solid var(--warn)}
.stepcard h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.stepcard .code{font-family:var(--f-num);font-size:14px;color:var(--muted)}
.hint{background:var(--walnut-soft);color:var(--walnut);border-radius:12px;padding:10px 12px;font-size:16px}
.hint.red{background:var(--danger-bg);color:var(--danger)}
.glabel{font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:48px;padding:6px 18px;font-size:17px}
.chip.sm{min-height:44px;padding:4px 14px;font-size:16px}
.chip.sym{min-width:56px;font-size:20px;padding:4px 10px}
.person{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.person .sym{font-size:18px;color:var(--walnut);letter-spacing:.15em}
.stepnav{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-top:4px}
.stepnav .secondary{font-size:24px}
.stepnav .primary{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:6px 10px}
.stepnav .primary small{font-size:13px;font-weight:400;opacity:.85}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

.facts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.fact{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;padding:10px 14px;text-align:left;display:flex;gap:10px;align-items:center;width:100%;font-size:16px}
.fact[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fact .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px}
.fact[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fact.bad .box{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.notes{display:flex;flex-direction:column;gap:6px}
.note{background:var(--surface);border-left:3px solid var(--walnut);padding:6px 10px;border-radius:4px;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img,.thumbs .ph{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--walnut-soft);display:grid;place-items:center;color:var(--walnut);font-size:12px}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field textarea,.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;padding:10px 12px;font-size:17px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.actionbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--raised);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.act{border:0;border-radius:14px;min-height:64px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;position:relative}
.act .ico{font-size:24px;line-height:1}
.act.end{background:var(--ink);color:var(--surface)}
.act .badge{top:4px;left:calc(50% + 10px)}
.timeline{display:flex;flex-direction:column;gap:0;list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:52px 44px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.timeline .t{font-family:var(--f-num);color:var(--muted)}
.timeline .s{font-family:var(--f-num);color:var(--walnut)}
.price{display:inline-block;border-radius:8px;background:var(--surface);border:1px dashed var(--line);padding:4px 10px;font-size:14px;color:var(--muted);user-select:none;-webkit-user-select:none;touch-action:none}
.price.on{background:var(--ink);color:var(--surface);border-style:solid;font-family:var(--f-num);font-size:16px}
.prodrow{display:flex;gap:12px;align-items:center}
.qr{width:44px;height:44px;flex:none;border-radius:8px;background:
 repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,var(--ink) 0 4px,transparent 4px 8px);opacity:.75;border:3px solid var(--raised);outline:1px solid var(--line)}
.primary{border:0;border-radius:16px;min-height:60px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:600;width:100%}
.primary:disabled{background:var(--line);color:var(--muted)}
.secondary{border:1.5px solid var(--line);border-radius:16px;min-height:56px;background:var(--raised);font-size:17px;width:100%}

.missing{font-size:14px;color:var(--danger);text-align:center}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(20,17,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0;font-weight:600}
.huge2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.huge{border:2px solid var(--line);background:var(--raised);border-radius:18px;min-height:96px;font-size:22px;font-weight:600}
.huge[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.huge.no[aria-pressed="true"]{background:var(--walnut);border-color:var(--walnut)}
.modal{position:fixed;inset:0;z-index:60;background:var(--danger);color:var(--on-danger);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));gap:16px;overflow-y:auto}
.modal h2{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.3;text-wrap:balance}
.modal ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;font-size:19px}
.modal .lead{font-size:17px;opacity:.9}
.modal button{margin-top:auto;border:0;border-radius:16px;min-height:64px;background:var(--on-danger);color:var(--danger);font-size:19px;font-weight:600}
.sig{width:100%;height:160px;background:var(--raised);border:1.5px dashed var(--line);border-radius:12px;touch-action:none;display:block}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:15px;z-index:70;max-width:90%;text-align:center}
.empty{color:var(--muted);text-align:center;padding:16px}
.search{border:1.5px solid var(--line);background:var(--raised);border-radius:14px;min-height:54px;padding:10px 14px;font-size:17px;width:100%}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lock{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (min-width:520px){body{padding-block:16px}.app{border-radius:24px;overflow:hidden;min-height:calc(100% - 32px);box-shadow:var(--shadow)}}
</style>

function stepCard(v,s,b4){

  if(s.who)inner+=whoCard(v);

}

   case 'net': S.online=!S.online; if(S.online&&S.pending){toast('เน็ตกลับมา · ส่งขึ้นครบ '+S.pending+' รายการ');S.pending=0}else if(!S.online)toast('จำลองเน็ตหลุด · ทุกการแตะยังบันทึกลงเครื่อง'); save(); render(); break;
   case 'fake': toast(b.dataset.m); break;
   case 'ck': {const i=b.dataset.i;const r=S.checklist.items[i]||{};S.checklist.items[i]=r.ok===true?{}:{ok:true};touch();render();break}
   case 'ckbad': {const i=b.dataset.i;sheet(`<h3>ไม่ผ่าน · ${esc(CHECK[i])}</h3><div class="field"><label for="ck-note">เป็นอะไร (สั้นๆ)</label><textarea id="ck-note"></textarea></div><label class="secondary" for="ck-photo" style="display:grid;place-items:center">◉ ถ่ายรูป</label><input type="file" id="ck-photo" accept="image/*" capture="environment" hidden><button class="primary" data-act="ckbadSave" data-i="${i}">บันทึก</button>`);break}
   case 'ckbadSave': {const t=document.getElementById('ck-note').value.trim();S.checklist.items[b.dataset.i]={ok:false,note:t||'ไม่ผ่าน'};touch();closeSheet();render();break}
   case 'ckdone': S.checklist.by='Bay';S.checklist.at=Date.now();touch();toast('บันทึกเช็กลิสต์แล้ว');go('home');break;
   case 'dchip': {const g=b.dataset.g;const val=b.dataset.v;const cur=draft.sel[g]||[];draft.sel[g]=b.dataset.one?(cur.includes(val)?[]:[val]):(cur.includes(val)?cur.filter(x=>x!==val):[...cur,val]);if(g==='day')draft.day=val;if(g==='time')draft.time=val;b.setAttribute('aria-pressed',(draft.sel[g]||[]).includes(val));if(b.dataset.one)b.parentElement.querySelectorAll('.chip').forEach(x=>{if(x!==b)x.setAttribute('aria-pressed','false')});break}
   case 'copyConfirm': {const t=`ยืนยันนัดดูโซฟาที่โชว์รูม ฌ เฌอ เจริญนคร\nวัน: ${draft.day} เวลา ${draft.time}\nที่อยู่: เจริญนคร 32/1 คลองสาน\nแผนที่: (ลิงก์ Google Maps)\nที่จอดรถ: (รายละเอียดที่จอด)\nเบอร์ติดต่อวันนัด: (เบอร์โชว์รูม)`;
     const done=()=>toast('คัดลอกแล้ว · วางในแชตไลน์ได้เลย');
     try{navigator.clipboard.writeText(t).then(done,()=>sheet(`<h3>ข้อความยืนยันนัด</h3><textarea class="search" style="min-height:180px" readonly>${esc(t)}</textarea>`,s=>s.querySelector('textarea').select()))}catch(_){sheet(`<h3>ข้อความยืนยันนัด</h3><textarea class="search" style="min-height:180px" readonly>${esc(t)}</textarea>`)}break}
   case 'saveAppt': {if(!draft.name.trim()){toast('ใส่ชื่อลูกค้าก่อน');break}const c={id:uid(),type:'person',name:draft.name.trim(),line:draft.line.trim()};S.customers.push(c);const [h,m]=draft.time.split(':').map(Number);const at=new Date(2026,9,draft.day==='วันนี้'?13:14,h,m).getTime();const sel={};Object.keys(draft.sel).filter(k=>k.startsWith('A1:')).forEach(k=>sel[k]=draft.sel[k]);S.appts.push({id:uid(),custId:c.id,at,path:'A',sel});touch();draft=null;toast('บันทึกนัดแล้ว');go('home');break}
   case 'startA': {const c={id:uid(),type:'person',name:'ลูกค้าไม่ได้นัด '+fmtT(Date.now()),tempName:1};S.customers.push(c);newVisit({custId:c.id,path:'A',walkin:true});render();break}
   case 'startB': startBSheet();break;
   case 'pickDes': {let id=b.dataset.id;if(id==='new'){const c={id:uid(),type:'person',name:'ดีไซเนอร์ใหม่',isDesigner:1,cycle:30,tempName:1};S.customers.push(c);id=c.id}closeSheet();newVisit({custId:id,path:'B'});S.step='B1';render();break}
   case 'startAppt': {const ap=S.appts.find(x=>x.id===b.dataset.id);ap.started=1;
     if(ap.path==='B'){const d=cust(ap.custId);b4Modal(d.name,()=>{const v2=newVisit({custId:ap.custId,path:'B',bmode:'client',clientId:ap.clientId,apptId:ap.id});log(v2,'B4','อ่านกฎเหล็ก B4 แล้ว');render()})}
     else{const v2=newVisit({custId:ap.custId,path:'A',sel:JSON.parse(JSON.stringify(ap.sel||{})),apptId:ap.id});render()}break}
   case 'openVisit': S.visitId=b.dataset.id;S.vtab='steps';S.step=null;go('visit');break;
   case 'step': S.step=b.dataset.k;S.vtab='steps';render();{const el=document.querySelector('.step[aria-current="step"]');el&&el.scrollIntoView({inline:'center',block:'nearest'})}break;
   case 'vtab': S.vtab=b.dataset.t;render();break;
   case 'chip': {const key=b.dataset.k+':'+b.dataset.g;const val=b.dataset.v;const cur=v.sel[key]||[];const on=!cur.includes(val);v.sel[key]=b.dataset.one?(on?[val]:[]):(on?[...cur,val]:cur.filter(x=>x!==val));log(v,b.dataset.k,(on?'':'ยกเลิก ')+val);render();break}
   case 'chan': {const k=b.dataset.v;v.chan=v.chan.includes(k)?v.chan.filter(x=>x!==k):[...v.chan,k];render();const el=document.getElementById('w-'+k);el&&el.focus();break}
   case 'pcount': {const n=+b.dataset.n;while(v.party.length<n)v.party.push({who:null,roles:[]});v.party.length=n;log(v,'P','มา '+(n===5?'5+':n)+' คน');render();break}
   case 'pwho': {const p=v.party[+b.dataset.i];p.who=p.who===b.dataset.v?null:b.dataset.v;log(v,'P','คนที่ '+(+b.dataset.i+1)+': '+(p.who||'-'));render();break}
   case 'prole': {const p=v.party[+b.dataset.i];const w=b.dataset.v;const on=!p.roles.includes(w);p.roles=on?[...p.roles,w]:p.roles.filter(x=>x!==w);log(v,'P',(p.who||'คนที่ '+(+b.dataset.i+1))+(on?' · ':' · ยกเลิก ')+w);render();toast((p.who||'คนที่ '+(+b.dataset.i+1))+(on?': ':': ยกเลิก ')+w);break}
   case 'car': {v.car.brand=v.car.brand===b.dataset.v?null:b.dataset.v;log(v,'P','รถ: '+(v.car.brand||'-'));render();break}
   case 'a6': {const g=b.dataset.g;v.a6[g]=v.a6[g]===b.dataset.v?null:b.dataset.v;log(v,'A6',b.dataset.v);render();break}
   case 'a6done': v.a6.done=!v.a6.done;if(v.a6.done)v.a6.later=false;log(v,'A6',v.a6.done?'เช็กทางเข้าแล้ว ผ่าน':'ยกเลิกเช็กทางเข้า');render();break;
   case 'a6later': v.a6.later=!v.a6.later;if(v.a6.later){v.a6.done=false;S.callbacks.push({id:uid(),custId:v.custId,due:TODAY.getTime()+2*DAY,about:'ตามรูปลิฟต์/ทางเข้า (A6)',reasons:[],last:'เข้าชมวันนี้'})}log(v,'A6',v.a6.later?'ลูกค้าจะส่งรูปทางเข้ามาทีหลัง · ตั้งเตือนตาม 2 วัน':'ยกเลิกรอรูป');render();break;
   case 'bmode': {const m=b.dataset.m;v.bmode=m;log(v,'B1',{alone:'มาคนเดียว',client:'มากับลูกค้าของเขา',loan:'มาขอยืมของ'}[m]);if(m==='client'){b4Modal(cname(cust(v.custId)),()=>{log(v,'B4','อ่านกฎเหล็ก B4 แล้ว');S.step='B4';render()})}else{S.step=m==='loan'?'B5':'B2';render()}break}
   case 'b4again': b4Modal(cname(cust(v.custId)));break;
   case 'note': noteSheet(b.dataset.k);break;
   case 'saveNote': {const t=document.getElementById('note-t').value.trim();if(t){(v.notes[b.dataset.k]=v.notes[b.dataset.k]||[]).push({text:t});log(v,b.dataset.k,'โน้ต: '+t)}closeSheet();render();break}
   case 'scan': scanSheet();break;
   case 'pickUnit': {const code=b.dataset.code;const ex=v.interests.find(i=>i.code===code);if(ex)ex.qty++;else v.interests.push({code,qty:1,grade:null});log(v,S.step||'-','สแกน '+unit(code).en);closeSheet();toast('เพิ่ม '+unit(code).en+' แล้ว');render();break}
   case 'interests': interestsSheet();break;
   case 'rmInt': {const it=v.interests.splice(+b.dataset.i,1)[0];log(v,'-','เอาออก '+unit(it.code).en);interestsSheet();render();break}
   case 'intGrade': {const it=v.interests[+b.dataset.i];it.grade=it.grade===b.dataset.v?null:b.dataset.v;log(v,'A5',unit(it.code).en+' · '+b.dataset.v);interestsSheet();break}
   case 'qty': {const it=v.interests[+b.dataset.i];it.qty=Math.max(1,it.qty+ +b.dataset.d);touch();interestsSheet();render();break}
   case 'close': v._c=null;closeVisitSheet();break;
   case 'oc': v._c.outcome=b.dataset.v;if(v._c.outcome==='buy')v._c.reasons=[];closeVisitSheet();break;
   case 'rs': {const r=v._c.reasons;const i=r.indexOf(b.dataset.v);i<0?r.push(b.dataset.v):r.splice(i,1);closeVisitSheet();break}
   case 'cbd': v._c.cb=+b.dataset.d;closeVisitSheet();break;
   case 'confirmClose': {const c=v._c;v.outcome=c.outcome;v.reasons=c.reasons;v.callback=c.cb;v.closed=true;v.deferred=false;
     const to=v.custId; const about=(v.interests.map(i=>unit(i.code).en+(i.grade?' · '+i.grade:'')).join(', ')||'เข้าชมโชว์รูม');
     S.callbacks.push({id:uid(),custId:to,due:TODAY.getTime()+c.cb*DAY,about:c.outcome==='buy'?'ยืนยันผ้า / มัดจำ · '+about:about,reasons:c.reasons,last:'เข้าชม '+fmtD(v.arrivedAt)});
     log(v,v.path==='A'?'A9':'B7','จบ: '+(c.outcome==='buy'?'ซื้อ':'ยังไม่ซื้อ')+(c.reasons.length?' · ติด '+c.reasons.join(', '):'')+' · ติดต่อกลับ '+fmtD(TODAY.getTime()+c.cb*DAY));
     toast('บันทึกแล้ว · ตั้งวันติดต่อกลับ '+fmtD(TODAY.getTime()+c.cb*DAY));go('home');break}
   case 'defer': v.deferred=true;touch();toast('ค้างไว้ที่หน้าแรก · กลับมากรอกได้ตลอด');go('home');break;
   case 'src': {const c=cust(v.custId);c.source=c.source===b.dataset.v?null:b.dataset.v;touch();render();break}
   case 'consent': {const c=cust(v.custId);c.consent=!c.consent;touch();render();break}
   case 'cf': S.custFilter=b.dataset.v;render();break;
   case 'cust': S.custId=b.dataset.id;go('cust');break;
   case 'cb': cbSheet(b.dataset.id);break;
   case 'cbr': {const k=S.callbacks.find(x=>x.id===b.dataset.id);k._r.res=b.dataset.v;cbSheet(k.id);break}
   case 'cbn': {const k=S.callbacks.find(x=>x.id===b.dataset.id);k._r.next=+b.dataset.d;cbSheet(k.id);break}
   case 'cbSave': {const k=S.callbacks.find(x=>x.id===b.dataset.id);k.done=k._r.res;if(k._r.next)S.callbacks.push({id:uid(),custId:k.custId,due:TODAY.getTime()+k._r.next*DAY,about:k.about,reasons:k.reasons,last:k._r.res+' '+fmtD(TODAY)});delete k._r;touch();closeSheet();toast('บันทึกผลแล้ว');render();break}
   case 'newLoan': loanDraft=null;loanSheet(b.dataset.c&&cust(b.dataset.c).isDesigner&&cust(b.dataset.c).type==='person'?b.dataset.c:null);break;
   case 'lu': loanDraft.unit=b.dataset.v;loanSheet();break;
   case 'lc': loanDraft.cust=b.dataset.v;loanSheet();break;
   case 'ld': loanDraft.days=+b.dataset.v;loanSheet();break;
   case 'lk': loanDraft.cond=b.dataset.v;loanSheet();break;
   case 'lphotoFake': loanDraft.photo=true;loanSheet();break;
   case 'sigClear': loanDraft.sig=false;loanSheet();break;
   case 'loanSave': {const L=loanDraft;S.loans.push({id:uid(),unit:L.unit,custId:L.cust,out:TODAY.getTime(),due:TODAY.getTime()+L.days*DAY,cond:L.cond,signed:1});if(v&&S.view==='visit')log(v,'B5','ยืม '+unit(L.unit).en+' คืน '+fmtD(TODAY.getTime()+L.days*DAY));touch();loanDraft=null;closeSheet();toast('บันทึกใบยืมแล้ว · เตือนก่อนครบ 7 วัน');render();break}
   case 'loan': loanDetail(b.dataset.id);break;
   case 'ret': {const l=S.loans.find(x=>x.id===b.dataset.id);l.back=TODAY.getTime();l.backCond=b.dataset.v;touch();closeSheet();toast('รับคืนแล้ว');render();break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target; const v=visit();
  if(t.dataset.draft){draft[t.dataset.draft]=t.value}
  else if(t.dataset.cf&&v){const c=cust(v.custId);c[t.dataset.cf]=t.value;if(t.dataset.cf==='name'){c.tempName=!t.value.trim();if(c.tempName)c.name='ลูกค้าใหม่';const h=document.querySelector('.top h1');if(h&&h.firstChild)h.firstChild.nodeValue=t.value.trim()||'ลูกค้าใหม่'}touchLater()}
  else if(t.dataset.car&&v){v.car.model=t.value;touchLater()}
  else if(t.dataset.vmemo&&v){v.memo=t.value;touchLater()}
  else if(t.dataset.a6&&v){v.a6[t.dataset.a6]=t.value;touchLater()}
  else if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
});
let tl=null; function touchLater(){clearTimeout(tl);tl=setTimeout(()=>{touch();const p=document.querySelector('.sync');if(p)p.outerHTML=syncPill()},500)}
document.addEventListener('change',e=>{
  if(e.target.id==='photo-in'&&e.target.files[0]){const v=visit();const f=e.target.files[0];const id=uid();const step=S.step||'-';v.photos.push({id,step,at:Date.now()});const r=new FileReader();r.onload=()=>{photos[id]=r.result;render()};r.readAsDataURL(f);log(v,step,'ถ่ายรูป');toast('เก็บรูปแล้ว · ติดกับขั้น '+step)}
});
/* hold-to-reveal price */
function reveal(el,on){if(!el)return;if(on){el.classList.add('on');el.textContent=`ปลีก ${el.dataset.hold}${el.dataset.showdes==='1'?` · designer ${el.dataset.des}`:''}`}else{el.classList.remove('on');el.textContent='●●●●● กดค้างดูราคา'}}
document.addEventListener('pointerdown',e=>{const p=e.target.closest('.price');if(p){e.preventDefault();reveal(p,true)}});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.price.on').forEach(p=>reveal(p,false)),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.price'))e.preventDefault()});

function render(){
  const views={home:vHome,checklist:vChecklist,appt:vAppt,visit:vVisit,callbacks:vCallbacks,customers:vCustomers,cust:vCust,loans:vLoans};
  $app.innerHTML=(views[S.view]||vHome)();
  if(S.view==='visit'){const el=document.querySelector('.step[aria-current="step"]');el&&el.scrollIntoView({inline:'center',block:'nearest'})}
}
setInterval(()=>{if(S.view==='visit'){const s=document.querySelector('.top .sub');const v=visit();if(s&&v)s.textContent=s.textContent.replace(/\d+ นาที$/,Math.max(1,Math.round((Date.now()-v.arrivedAt)/60000))+' นาที')}},30000);
render();
})();
</script>
