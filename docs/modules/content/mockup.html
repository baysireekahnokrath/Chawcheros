<title>Chaw Cher Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* โทเคนเดียวกับ web/src/app/globals.css ของ Chaw Cher OS */
:root {
  --bg: #faf9f7; --surface: #ffffff; --sunk: #f3f0ec; --border: #e7e2db;
  --text: #1c1917; --muted: #78716c; --accent: #6b5b4a; --accent-fg: #ffffff;
  --ok: #3f6f4f; --warn: #9a6b23; --danger: #9b3232; --locked: #7c3f58;
  --p1: #a0673f; --p2: #5d7b58; --p3: #49698a; --p4: #9a7d2e; --p5: #8b4763; --p6: #2f7a74; --pn: #a8a29e;
  --shadow: 0 1px 2px rgba(28,25,23,.06), 0 8px 24px rgba(28,25,23,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171513; --surface: #211e1b; --sunk: #1b1917; --border: #38322c;
    --text: #f5f2ee; --muted: #a8a29e; --accent: #c4ad94; --accent-fg: #1c1917;
    --ok: #7fb08d; --warn: #d5a45c; --danger: #e08a8a; --locked: #d49bb6;
    --p1: #cf9670; --p2: #93b38d; --p3: #86a7c8; --p4: #cdb163; --p5: #c98aa4; --p6: #6fb5ae; --pn: #78716c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171513; --surface: #211e1b; --sunk: #1b1917; --border: #38322c;
  --text: #f5f2ee; --muted: #a8a29e; --accent: #c4ad94; --accent-fg: #1c1917;
  --ok: #7fb08d; --warn: #d5a45c; --danger: #e08a8a; --locked: #d49bb6;
  --p1: #cf9670; --p2: #93b38d; --p3: #86a7c8; --p4: #cdb163; --p5: #c98aa4; --p6: #6fb5ae; --pn: #78716c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.num { font-variant-numeric: tabular-nums; }

/* ---------- โครงแอป ---------- */
.mock-flag {
  background: var(--sunk); color: var(--muted); font-size: 12px; text-align: center;
  padding: 6px 16px; border-bottom: 1px solid var(--border);
}
.app { display: grid; grid-template-columns: 1fr; min-height: calc(100% - 31px); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap;
}
.top h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .top h1 { flex-basis: 100%; } }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 5px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 500; }
main { padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); padding: 6px 0; position: relative; border-radius: 12px;
}
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.nav svg { width: 22px; height: 22px; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--locked); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; line-height: 16px; min-width: 16px; text-align: center; }
.fab {
  position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31;
  width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-fg);
  box-shadow: var(--shadow); display: grid; place-items: center;
}
.fab svg { width: 26px; height: 26px; }
.fabmenu { position: fixed; right: 16px; bottom: calc(142px + env(safe-area-inset-bottom, 0px)); z-index: 32; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 230px; }
.fabmenu button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; display: grid; gap: 1px; }
.fabmenu button:hover { background: var(--sunk); }
.fabmenu small { color: var(--muted); font-size: 12px; }
@media (min-width: 900px) { .fabmenu { bottom: 90px; right: 24px; } }

@media (min-width: 900px) {
  .app { grid-template-columns: 208px 1fr; }
  .nav {
    position: sticky; top: 0; height: 100vh; grid-template-columns: 1fr; align-content: start; gap: 4px;
    border-top: 0; border-right: 1px solid var(--border); padding: 16px 12px; grid-row: 1 / span 2;
  }
  .nav .brandmark { display: block; }
  .nav button { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14px; padding: 10px 12px; }
  .nav button[aria-current="page"] { background: var(--sunk); }
  .badge { position: static; margin-left: auto; }
  .fab { bottom: 24px; right: 24px; }
  main { padding-bottom: 48px; }
}
.brandmark { display: none; font-weight: 700; letter-spacing: -.01em; padding: 4px 12px 16px; font-size: 15px; }
.brandmark small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

/* ---------- ชิ้นส่วนทั่วไป ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; font-weight: 600; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 600; }
.eyebrow { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-size: 14px; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.t-idea { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.t-work { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.t-review { background: color-mix(in srgb, var(--locked) 14%, transparent); color: var(--locked); }
.t-bounce { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
.t-ready { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.t-posted { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.ch { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; border: 1px solid var(--border); border-radius: 6px; padding: 0 4px; color: var(--muted); background: var(--surface); line-height: 16px; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; outline: none; }
.inp:focus { border-color: var(--accent); }
textarea.inp { resize: vertical; min-height: 88px; line-height: 1.6; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip[disabled] { opacity: .4; cursor: not-allowed; }
.note { border-radius: 14px; padding: 12px 14px; font-size: 13px; border: 1px solid; }
.note.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 7%, transparent); }
.note.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.note.bad { border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 6%, transparent); }
.note.lock { border-color: color-mix(in srgb, var(--locked) 35%, transparent); background: color-mix(in srgb, var(--locked) 6%, transparent); }
.back { border: 0; background: none; color: var(--muted); padding: 4px 0; font-size: 14px; display: inline-flex; gap: 4px; align-items: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
@media (min-width: 900px) { .toast { bottom: 32px; } }

/* ---------- ปฏิทิน ---------- */
.calbar { display: grid; gap: 10px; margin-bottom: 12px; }
.calnav { display: flex; align-items: center; gap: 6px; }
.calnav h2 { flex: 1; font-size: 19px; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.viewseg { overflow-x: auto; max-width: 100%; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters select { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 6px 10px; font-size: 13px; }
.filters select.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.card {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c);
  border-radius: 12px; padding: 8px; text-align: left; width: 100%;
}
.card .thumb { width: 64px; aspect-ratio: 1; border-radius: 8px; }
.card .hook { font-size: 14px; font-weight: 500; line-height: 1.4; }
.card .meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.card.nothumb { grid-template-columns: 1fr; }
.thumb { background: var(--g); position: relative; overflow: hidden; max-width: 100%; }
.thumb::after { content: ""; position: absolute; inset: 58% 18% 16% 18%; border-radius: 6px 6px 3px 3px; background: rgba(255,255,255,.28); box-shadow: 0 -10px 0 -3px rgba(255,255,255,.18); }

.agenda { display: grid; gap: 14px; }
.aday { display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
.aday .d { text-align: center; padding-top: 4px; }
.aday .d b { display: block; font-size: 22px; line-height: 1; font-weight: 600; }
.aday .d span { font-size: 12px; color: var(--muted); }
.aday.today .d b { color: var(--accent); }
.aday .cards { display: grid; gap: 8px; }

.cols { display: grid; gap: 8px; }
.col { min-width: 0; }
.col .h { font-size: 12px; color: var(--muted); padding: 4px 2px 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.col .h b { font-size: 16px; color: var(--text); margin-right: 4px; }
.col.today .h b { color: var(--accent); }
.col .cards { display: grid; gap: 6px; }
.cols.compact .card { grid-template-columns: 1fr; padding: 6px; }
.cols.compact .card .thumb { width: 100%; aspect-ratio: 4/3; }
.cols.compact .card .hook { font-size: 12.5px; }

.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.month .wd { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--sunk); }
.mcell { min-height: 84px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; display: grid; align-content: start; gap: 3px; min-width: 0; }
.mcell.out { background: var(--sunk); }
.mcell.out .dn { opacity: .45; }
.mcell .dn { font-size: 12px; font-weight: 500; }
.mcell.today .dn { background: var(--accent); color: var(--accent-fg); border-radius: 99px; width: 22px; height: 22px; display: grid; place-items: center; }
.mcell.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.mbar { border: 0; background: var(--c); color: #fff; border-radius: 4px; font-size: 11px; line-height: 1.35; padding: 1px 4px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.mcard { display: none; }
@media (min-width: 720px) {
  .mcell { min-height: 132px; padding: 6px; gap: 6px; }
  .mbar { display: none; }
  .mcard { display: grid; gap: 4px; border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: 8px; padding: 4px; background: var(--surface); text-align: left; width: 100%; }
  .mcard .thumb { width: 100%; aspect-ratio: 16/9; border-radius: 5px; }
  .mcard .hook { font-size: 12px; line-height: 1.35; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mcard .meta { display: flex; gap: 3px; flex-wrap: wrap; }
  .mcard[draggable="true"] { cursor: grab; }
}

/* ---------- ช่องไอเดีย ---------- */
.idea { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: grid; gap: 10px; margin-bottom: 14px; box-shadow: var(--shadow); }
.idea textarea { min-height: 56px; }
.idea .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.idea .foot .inp { flex: 1 1 200px; padding: 8px 10px; font-size: 14px; }
.understood { display: grid; gap: 4px; font-size: 13.5px; background: var(--sunk); border-radius: 12px; padding: 10px 12px; }
.understood b { color: var(--muted); font-weight: 500; font-size: 12px; margin-right: 6px; }
.offplan { font-size: 10.5px; font-weight: 600; border-radius: 6px; padding: 0 5px; line-height: 16px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

/* ---------- หน้าชิ้นงาน ---------- */
.detail { display: grid; gap: 14px; }
@media (min-width: 1000px) { .detail.two { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
.progress { display: flex; gap: 8px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 13px; background: var(--surface); }
.step.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.step.wait { color: var(--warn); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.preview { border: 1px solid var(--border); border-radius: 14px; background: var(--bg); padding: 12px; }
.preview .who { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.preview .av { width: 32px; height: 32px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.preview pre { white-space: pre-wrap; font: inherit; margin: 0; font-size: 14px; }
.counter { font-size: 12px; color: var(--muted); }
.counter.over { color: var(--danger); font-weight: 600; }
.trace { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.trace span { background: var(--sunk); border-radius: 6px; padding: 1px 6px; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.imgs .it { display: grid; gap: 4px; }
.imgs .thumb { aspect-ratio: 1; border-radius: 10px; width: 100%; }
.imgs .lab { font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.imgs .lab button { border: 0; background: var(--sunk); border-radius: 6px; padding: 0 6px; font-size: 12px; }
.ask { border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.ask .q { font-weight: 600; }
.bot { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.writing { display: flex; gap: 10px; align-items: center; }
.dots i { display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--accent); margin: 0 2px; animation: b 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes b { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.check.done span { text-decoration: line-through; color: var(--muted); }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 14px; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; }
.plc { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
.plc:first-of-type { border-top: 0; }
.sticky-actions { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--border); z-index: 5; }
@media (min-width: 900px) { .sticky-actions { bottom: 0; } }
.sticky-actions .btn { flex: 1; min-height: 46px; }

/* ---------- แผน ---------- */
.timeline { display: grid; gap: 6px; }
.tl-head { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.tl-row { position: relative; height: 30px; background: repeating-linear-gradient(90deg, transparent 0 calc(33.333% - 1px), var(--border) calc(33.333% - 1px) 33.333%); border-radius: 6px; }
.tl-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 1px solid var(--c); color: var(--text); font-size: 12px; padding: 0 8px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.slot .d { font-size: 13px; }
.slot .d b { display: block; font-size: 18px; line-height: 1.1; }
.hcv { display: grid; gap: 2px; font-size: 13.5px; }
.hcv b { font-weight: 600; color: var(--muted); font-size: 11.5px; letter-spacing: .03em; margin-right: 6px; }
.week-h { font-size: 13px; font-weight: 600; margin-top: 10px; color: var(--accent); }

/* ---------- แบรนด์ ---------- */
.sec { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.sec:first-child { border-top: 0; }
.sec p { grid-column: 1 / -1; margin: 0; font-size: 13.5px; }
.chat { display: grid; gap: 10px; }

function groups() {
  const out = [];
  for (const it of items) {
    if (it.brand !== S.brand) continue;
    const f = S.f;
    if (f.pillar && it.pillar !== f.pillar) continue;
    if (f.campaign && it.campaign !== f.campaign) continue;
    if (f.product && !it.products.includes(f.product)) continue;
    if (f.owner && it.owner !== f.owner) continue;
    const byDate = {};
    for (const p of it.place) {
      if (p.skip) continue;
      if (f.ch && p.ch !== f.ch) continue;
      (byDate[p.date] ||= []).push(p.ch);
    }
    for (const [date, chs] of Object.entries(byDate)) out.push({ it, date, chs });
  }
  return out;
}
const onDate = (gs, d) => gs.filter(g => g.date === d);
const hasPic = it => it.images.length > 0; // K4: ไม่มีรูป = โชว์แค่ hook

function card(g) {
  const { it } = g;
  const pic = hasPic(it) ? `<div class="thumb" style="--g:${grad(it.images[0].hue)}"></div>` : '';
  return `<button class="card ${pic ? '' : 'nothumb'}" style="--c:${colorOf(it)}" data-act="open" data-id="${it.id}">
    ${pic}<div><div class="hook">${esc(it.hook)}</div>
    <div class="meta">${g.chs.map(chTag).join('')} ${stagePill(it.stage)}${it.offPlan ? '<span class="offplan">นอกแผน</span>' : ''}</div></div></button>`;
}

function viewCal() {

      </div>`;
    }
    body = `<div class="scroll-x"><div class="month">${cells}</div></div>

  } else if (S.view === 'agenda') {

    const dates = [...new Set(gs.map(g => g.date))].filter(d => d.slice(0, 7) === S.cursor.slice(0, 7)).sort();
    body = dates.length ? `<div class="agenda">${dates.map(d => {
      const dd = D(d);
      return `<div class="aday ${d === TODAY ? 'today' : ''}"><div class="d"><b class="num">${dd.getDate()}</b><span>${TH_WD[dd.getDay()]}</span></div>
        <div class="cards">${onDate(gs, d).map(card).join('')}</div></div>`;
    }).join('')}</div>` : `<div class="panel muted">เดือนนี้ยังไม่มีชิ้นงานตามตัวกรองที่เลือก</div>`;
  } else {
    const n = S.view === 'day' ? 1 : S.view === '3day' ? 3 : 7;
    const start = S.view === 'week' ? add(S.cursor, -D(S.cursor).getDay()) : S.cursor;
    const end = add(start, n - 1);
    title = `${fmt(start)} – ${fmt(end)}`;
    let cols = '';
    for (let i = 0; i < n; i++) {
      const d = add(start, i), dd = D(d);
      cols += `<div class="col ${d === TODAY ? 'today' : ''}"><div class="h"><b class="num">${dd.getDate()}</b>${TH_WD[dd.getDay()]}</div>
        <div class="cards">${onDate(gs, d).map(card).join('') || '<span class="xs muted">—</span>'}</div></div>`;
    }
    body = `<div class="scroll-x"><div class="cols ${n > 3 ? 'compact' : ''}" style="grid-template-columns:repeat(${n}, minmax(${n > 3 ? 96 : 0}px,1fr))">${cols}</div></div>`;
  }

  const opt = (key, label, list) => `<select id="f-${key}" class="${S.f[key] ? 'on' : ''}" data-filter="${key}" aria-label="${label}">
    <option value="">${label}: ทั้งหมด</option>${list.map(([v, t]) => `<option value="${esc(v)}" ${S.f[key] === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const pl = PILLARS[S.brand], cps = CAMPAIGNS.filter(c => c.brand === S.brand);
  const legend = (S.colorBy === 'pillar' ? pl : cps).map(x => `<span><i style="background:${x.c}"></i>${esc(x.name)}</span>`).join('') +

  return `<div class="calbar">

      <button class="iconbtn" data-act="calNext" aria-label="ถัดไป">${svg('next')}</button>
      <h2 class="num">${title}</h2>

      ${opt('product', 'สินค้า', PRODUCTS[S.brand].map(p => [p, p]))}

    </div>
  </div>${body}`;
}

function parseIdea(text) {
  const t = text.toLowerCase();
  const alias = { 'emu': 'Emu Sofa', 'อีมู': 'Emu Sofa', 'กระสา': 'กระสา โซฟา 3 ที่นั่ง', 'กระเรียน': 'กระเรียน โซฟา 2 ที่นั่ง', 'koontong': 'Koontong Sideboard', 'คุณทอง': 'Koontong Sideboard', 'กีวี่': 'กีวี่ เก้าอี้' };
  const products = [...new Set(Object.entries(alias).filter(([k]) => t.includes(k)).map(([, v]) => v))].filter(p => PRODUCTS[S.brand].includes(p));
  const date = t.includes('วันนี้') ? TODAY : add(TODAY, 1);
  const topic = (text.match(/เรื่อง\s*([^ใ]+?)(\s+ใช้|\s+มี|$)/) || [])[1]?.trim() || text.slice(0, 40);
  const ch = ['FB', 'IG']; if (/เว็บ|บล็อก|blog|seo/i.test(text)) ch.push('WEB');
  return { topic, products, date, ch, pillar: products.length ? PILLARS[S.brand][0].id : '' };
}

    agentBox = `<div class="ask"><div class="row"><span class="bot">AI</span><span class="q">ก่อนเขียน ขอถามพี่ Bay 1 ข้อ</span></div>
      <div>${esc(it.question.q)}</div>
      <div class="chips">${it.question.choices.map(c => `<button class="chip" data-act="answer" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <p class="xs muted">คำตอบที่ใช้กับงานอื่นได้ agent จะเสนอจดลงสมุดความคิด · พี่กดยืนยันเองทุกข้อ</p></div>`;
  } else if (it.agent === 'writing') {
    agentBox = `<div class="ask"><div class="writing"><span class="bot">AI</span><span>Content agent กำลังเขียน ${chs.map(c => CH[c]).join(' · ')}</span><span class="dots"><i></i><i></i><i></i></span></div></div>`;
  } else if (it.agent === 'idle') {
    agentBox = `<div class="ask"><div class="row"><span class="bot">AI</span><span class="q">ยังไม่ได้ให้ agent เขียน</span></div>
      <button class="btn primary" data-act="runAgent">ส่งให้ Content agent เขียนทุกช่องทาง</button></div>`;
  }

  const bounceBox = it.stage === 'bounce' ? `<div class="note bad"><div class="spread"><b>Bay ตีกลับ · แก้ทีละข้อ แล้วส่งใหม่</b><span class="xs muted">v${it.version}</span></div>
      <div style="margin-top:6px">${it.comments.map((c, i) => `<label class="check ${c.done ? 'done' : ''}"><input type="checkbox" id="cm-${it.id}-${i}" data-act="tick" data-i="${i}" ${c.done ? 'checked' : ''}><span><b>${esc(c.target)}</b> · ${esc(c.text)}</span></label>`).join('')}</div>
      <button class="btn primary" style="margin-top:8px;width:100%" data-act="resubmit" ${it.comments.every(c => c.done) ? '' : 'disabled'}>ส่งตรวจอีกครั้ง${it.comments.every(c => c.done) ? '' : ` · เหลือ ${it.comments.filter(c => !c.done).length} ข้อ`}</button></div>` : '';

  const lockBox = ['ready', 'posted'].includes(it.stage) ? (S.unlock
    ? `<div class="note warn">กำลังแก้หลังอนุมัติ · บันทึกแล้วการอนุมัติจะเป็นโมฆะ งานกลับไปรอ Bay ตรวจใหม่</div>`
    : `<div class="note ok"><div class="spread"><span><b>Bay อนุมัติแล้วทั้งชุด</b> · ภาพและข้อความทุกช่องทาง</span>
       ${it.stage === 'ready' ? `<button class="btn sm" data-act="unlock">แก้ (ถอนอนุมัติ)</button>` : ''}</div></div>`) : '';

  const d = it.drafts;
  let tabBody = '';
  if (!d) tabBody = `<p class="muted small">ร่างจะขึ้นที่นี่เมื่อ agent เขียนเสร็จ</p>`;
  else if (S.tab === 'WEB') {
    const w = d.WEB;
    tabBody = `<div class="stack">
      <label class="f">หัวเรื่อง ${counter(w.title.length, LIMIT.WEBtitle)}<input class="inp" id="w-title" data-draft="WEB.title" value="${esc(w.title)}" ${locked ? 'readonly' : ''}></label>
      <label class="f">คำค้นหลัก<input class="inp" id="w-kw" data-draft="WEB.keyword" value="${esc(w.keyword)}" ${locked ? 'readonly' : ''}></label>
      <label class="f">Meta description ${counter(w.meta.length, LIMIT.WEBmeta)}<textarea class="inp" id="w-meta" data-draft="WEB.meta" rows="2" ${locked ? 'readonly' : ''}>${esc(w.meta)}</textarea></label>
      <label class="f">เนื้อหาบทความ<textarea class="inp" id="w-body" data-draft="WEB.text" rows="10" ${locked ? 'readonly' : ''}>${esc(w.text)}</textarea></label>
    </div>`;
  } else {
    const x = d[S.tab];
    tabBody = `<div class="preview"><div class="who"><span class="av">${it.brand === 'cc' ? 'ฌ' : 'H'}</span><div><b class="small">${BRANDS[it.brand]}</b><div class="xs muted">พรีวิว ${CH[S.tab]}</div></div></div>
        ${hasPic(it) ? `<div class="thumb" style="--g:${grad(it.images[0].hue)};aspect-ratio:${S.tab === 'IG' ? '4/5' : '16/10'};border-radius:10px;margin-bottom:8px;max-height:260px"></div>` : ''}
        <pre>${esc(x.text)}</pre></div>
      <label class="f" style="margin-top:12px">แก้ข้อความ ${counter(x.text.length, LIMIT[S.tab])}
        <textarea class="inp" id="d-${S.tab}" data-draft="${S.tab}.text" rows="7" ${locked ? 'readonly' : ''}>${esc(x.text)}</textarea></label>
      <label class="f" style="margin-top:10px">คอมเมนต์แรก <span class="hint">คัดลอกไปวางตอนโพสต์</span>
        <div class="row" style="flex-wrap:nowrap"><input class="inp" id="fc-${S.tab}" data-fc="${S.tab}" value="${esc(it.firstComment[S.tab] || '')}"><button class="btn sm" data-act="copy" data-v="${esc(it.firstComment[S.tab] || '')}">คัดลอก</button></div></label>`;
  }
  const cur = d && (S.tab === 'WEB' ? d.WEB : d[S.tab]);
  const humanBadge = cur?.human
    ? `<div class="note warn small">คนแก้ช่องนี้แล้ว · AI จะไม่เขียนทับ <button class="btn sm ghost" data-act="redo">ให้ AI ร่างใหม่ช่องนี้</button></div>`
    : (d ? `<div class="trace">ใช้: ${TRACE.map(t => `<span>${t}</span>`).join('')}</div>` : '');

  const imgBox = needImg ? `<div class="panel stack">
      <div class="spread"><h3>ภาพ ${it.type === 'album' ? `· อัลบั้ม ${it.images.length} ภาพ` : ''}</h3><span class="xs muted">แปะลิงก์ Drive/Figma · ภาพ 1 = key visual</span></div>
      ${it.images.length ? `<div class="imgs">${it.images.map((m, i) => `<div class="it"><div class="thumb" style="--g:${grad(m.hue)}"></div>
        <div class="lab"><span>ภาพ ${i + 1}${i === 0 ? ' ★' : ''}</span>${it.type === 'album' && i > 0 && !locked ? `<button data-act="imgUp" data-i="${i}" aria-label="เลื่อนภาพ ${i + 1} ขึ้น">↑</button>` : ''}</div></div>`).join('')}</div>`
        : `<p class="small muted">ยังไม่มีภาพ · รอ ${PEOPLE[it.owner] || 'กราฟิก'}</p>`}
      ${!it.imagesDone ? `<button class="btn" data-act="simImages">จำลอง: กราฟิกแปะภาพเสร็จ</button>` : ''}
    </div>` : '';

  const plcBox = `<div class="panel"><h3 style="margin-bottom:6px">ลงที่ไหน วันไหน</h3>
    ${it.place.map((p, i) => `<div class="plc">${chTag(p.ch)}
      <div class="row" style="justify-content:space-between">
        ${p.skip ? `<span class="small muted">ไม่ลงที่นี่แล้ว · ${esc(p.skip)}</span>` : `<input type="date" class="inp" id="pd-${it.id}-${i}" style="max-width:170px;padding:6px 10px" data-pdate="${i}" value="${p.date}">
        ${it.stage === 'ready' || it.stage === 'posted' ? (p.url ? `<span class="xs" style="color:var(--ok)">โพสต์แล้ว ✓</span>` : `<button class="btn sm" data-act="posted" data-i="${i}">แปะลิงก์โพสต์จริง</button>`) : ''}
        ${!p.url ? `<button class="btn sm ghost" data-act="skip" data-i="${i}">ไม่ลงที่นี่แล้ว</button>` : ''}`}
      </div></div>`).join('')}
    ${it.stage === 'ready' ? `<p class="xs muted" style="margin:6px 0 0">ลงครบทุกช่องทาง → เปลี่ยนเป็น “โพสต์แล้ว” เอง</p>` : ''}</div>`;

  const info = `<div class="panel"><dl class="kv">
      <dt>แบรนด์</dt><dd>${BRANDS[it.brand]}</dd><dt>ประเภท</dt><dd>${TYPES[it.type]}</dd>
      <dt>Hook</dt><dd>${esc(it.hook)}</dd><dt>เนื้อหา</dt><dd>${esc(it.content) || '<span class="muted">—</span>'}</dd>
      <dt>Visual</dt><dd>${esc(it.visual) || '<span class="muted">—</span>'}</dd>
      <dt>Pillar</dt><dd>${esc(pillarOf(it)?.name || '—')}</dd><dt>แคมเปญ</dt><dd>${esc(campOf(it)?.name || '—')}</dd>
      <dt>ธีม</dt><dd>${esc(THEMES.find(t => t.id === it.theme)?.name || '—')}</dd>
      <dt>สินค้า</dt><dd>${it.products.length ? it.products.map(esc).join(' · ') : '<span class="muted">ไม่ผูก</span>'}</dd>
      <dt>คนทำภาพ</dt><dd>${PEOPLE[it.owner] || '—'}</dd></dl>
      ${it.versions.length ? `<div style="margin-top:10px"><div class="eyebrow">ประวัติเวอร์ชัน</div>${it.versions.map(v => `<div class="xs muted">v${v.v} · ${v.when} · ${esc(v.note)}</div>`).join('')}<div class="xs">v${it.version} · ตอนนี้</div></div>` : ''}
    </div>`;

  const reviewCta = it.stage === 'review' ? `<div class="note lock"><div class="spread"><span><b>รอ Bay ตรวจ</b> · ภาพ + ข้อความทุกช่องทางในครั้งเดียว</span>
     ${isBay ? `<button class="btn sm primary" data-act="goReview" data-id="${it.id}">ไปหน้าตรวจ</button>` : ''}</div></div>` : '';

  return `<button class="back" data-act="back">← กลับ</button>
  <div class="detail two">
    <div class="stack">
      <div class="spread"><div><div class="eyebrow">${BRANDS[it.brand]} · ${TYPES[it.type]}</div><h2>${esc(it.title)}</h2></div>${stagePill(it.stage)}</div>
      <div class="progress">
        <span class="step ${textDone ? 'done' : 'wait'}">ข้อความ ${textDone ? '✓' : '⏳'}</span>
        ${needImg ? `<span class="step ${it.imagesDone ? 'done' : 'wait'}">ภาพ ${it.imagesDone ? '✓' : '⏳'}</span>` : ''}
        <span class="step ${['review', 'ready', 'posted'].includes(it.stage) ? 'done' : ''}">Bay ตรวจ ${['ready', 'posted'].includes(it.stage) ? '✓' : ''}</span>
      </div>
      ${agentBox}${bounceBox}${lockBox}${reviewCta}
      <div class="panel stack">
        <div class="tabs" role="tablist">${chs.map(c => `<button role="tab" aria-selected="${S.tab === c}" data-act="tab" data-v="${c}">${CH[c]}</button>`).join('')}</div>
        ${humanBadge}${tabBody}
      </div>
    </div>
    <div class="stack">${imgBox}${plcBox}${info}</div>
  </div>`;
}

      <label class="f">แคมเปญ<select class="inp" id="n-camp"><option value="">ไม่ผูก</option>${cps.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <label class="f">คนทำภาพ<select class="inp" id="n-owner">${Object.entries(PEOPLE).map(([k, v]) => `<option value="${k}" ${k === 'ton' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <div class="f" style="grid-column:1/-1;font-size:13px;font-weight:500">สินค้า <span class="hint">ไม่บังคับ</span>
        <div class="chips">${PRODUCTS[S.brand].map(p => `<button type="button" class="chip" data-act="nProd" data-v="${esc(p)}" aria-pressed="${NEW.products.includes(p)}">${esc(p)}</button>`).join('')}</div></div>

   หน้าจอ: ตรวจ (Bay)

function viewReview() {
  const list = items.filter(i => i.brand === S.brand && i.stage === 'review');
  const note = S.pendingNote ? `<div class="ask"><div class="row"><span class="bot">AI</span><span class="q">จดลงสมุดความคิดไหม</span></div>
      <div>“${esc(S.pendingNote.text)}”</div><div class="xs muted">มาจากเหตุผลที่พี่ตีกลับ “${esc(S.pendingNote.from)}”</div>
      <div class="row"><select class="inp" id="nb-scope" style="max-width:200px"><option value="all">ใช้ทุกแบรนด์</option><option value="${S.brand}">เฉพาะ ${BRANDS[S.brand]}</option></select>
      <button class="btn primary sm" data-act="nbYes">จดลงสมุด</button><button class="btn sm" data-act="nbNo">ไม่ต้องจด</button></div></div>` : '';
  return `<div class="stack">
    <div><div class="eyebrow">${BRANDS[S.brand]}</div><h2>รอ Bay ตรวจ · ${list.length} ชิ้น</h2></div>
    ${S.role !== 'bay' ? `<div class="note lock">กำลังดูในฐานะการตลาด · อนุมัติได้เฉพาะ Bay (สลับบทบาทได้ที่มุมขวาบน)</div>` : ''}
    ${note}
    ${list.map(it => `<button class="card ${hasPic(it) ? '' : 'nothumb'}" style="--c:${colorOf(it)}" data-act="goReview" data-id="${it.id}">
      ${hasPic(it) ? `<div class="thumb" style="--g:${grad(it.images[0].hue)}"></div>` : ''}
      <div><div class="hook">${esc(it.hook)}</div><div class="meta">${[...new Set(it.place.map(p => p.ch))].map(chTag).join('')}<span class="xs muted">· ${TYPES[it.type]} · ลงวันแรก ${fmt(it.place.map(p => p.date).sort()[0])}</span></div></div></button>`).join('') || '<div class="panel muted">ไม่มีงานรอตรวจ</div>'}
  </div>`;
}

function viewReviewItem() {
  const it = itemById(S.itemId);
  const chs = [...new Set(it.place.filter(p => !p.skip).map(p => p.ch))];
  const isBay = S.role === 'bay';
  const targets = ['ทั้งชิ้น', ...it.images.map((_, i) => `ภาพ ${i + 1}`), ...chs.map(c => CH[c])];
  const d = it.drafts;
  const bounce = S.bounceRows ? `<div class="panel stack"><h3>ตีกลับ · บอกทีละข้อว่าต้องแก้อะไร</h3>
    ${S.bounceRows.map((r, i) => `<div class="row" style="flex-wrap:nowrap;align-items:flex-start">
      <select class="inp" id="br-t-${i}" data-brow="${i}" data-k="target" style="max-width:130px">${targets.map(t => `<option ${r.target === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input class="inp" id="br-x-${i}" data-brow="${i}" data-k="text" placeholder="ต้องแก้อะไร" value="${esc(r.text)}"></div>`).join('')}
    <div class="row"><button class="btn sm" data-act="addRow">+ อีกข้อ</button></div>
    <div class="row"><button class="btn danger" data-act="doBounce">ส่งกลับให้แก้</button><button class="btn ghost" data-act="cancelBounce">ยกเลิก</button></div>
    <p class="xs muted" style="margin:0">ต้องมีเหตุผลอย่างน้อย 1 ข้อ · agent จะเรียนจากเหตุผลนี้แล้วเสนอจดลงสมุด</p></div>` : '';
  return `<button class="back" data-act="back">← กลับ</button>
  <div class="stack" style="max-width:860px">
    <div class="spread"><div><div class="eyebrow">ตรวจทั้งชุด · ${BRANDS[it.brand]} · ${TYPES[it.type]} · v${it.version}</div><h2>${esc(it.hook)}</h2></div>${stagePill(it.stage)}</div>
    ${it.images.length ? `<div class="panel"><div class="imgs">${it.images.map((m, i) => `<div class="it"><div class="thumb" style="--g:${grad(m.hue)}"></div><div class="lab"><span>ภาพ ${i + 1}${i === 0 ? ' ★' : ''}</span></div></div>`).join('')}</div></div>` : ''}
    ${chs.map(c => `<div class="panel stack"><div class="spread"><h3>${CH[c]}</h3><span class="xs muted">ลง ${it.place.filter(p => p.ch === c).map(p => fmt(p.date)).join(', ')}</span></div>
      ${c === 'WEB' ? `<div class="kv"><dt>หัวเรื่อง</dt><dd>${esc(d.WEB.title)}</dd><dt>คำค้นหลัก</dt><dd>${esc(d.WEB.keyword)}</dd><dt>Meta</dt><dd>${esc(d.WEB.meta)}</dd></div><pre class="small" style="white-space:pre-wrap;font:inherit;margin:0">${esc(d.WEB.text)}</pre>`
        : `<pre style="white-space:pre-wrap;font:inherit;margin:0">${esc(d[c].text)}</pre>`}
      <div class="trace">ใช้: ${TRACE.map(t => `<span>${t}</span>`).join('')}</div></div>`).join('')}
    ${bounce}
    ${!S.bounceRows ? `<div class="sticky-actions">
      <button class="btn danger" data-act="startBounce" ${isBay ? '' : 'disabled'}>ตีกลับ</button>
      <button class="btn primary" data-act="approve" ${isBay ? '' : 'disabled'}>${isBay ? 'อนุมัติทั้งชุด' : 'อนุมัติได้เฉพาะ Bay'}</button></div>` : ''}
  </div>`;
}

/* ============================================================
   หน้าจอ: แผน
   ============================================================ */
function viewPlan() {
  const ths = THEMES.filter(t => t.brand === S.brand);
  const from = '2026-10-01', span = daysBetween(from, '2027-01-01');
  const bars = ths.map(t => {
    const a = Math.max(0, daysBetween(from, t.from)), b = Math.min(span, daysBetween(from, t.to) + 1);
    return b > 0 ? `<div class="tl-row"><div class="tl-bar" style="--c:${t.c};left:${a / span * 100}%;width:${(b - a) / span * 100}%" title="${esc(t.name)}">${esc(t.name)}</div></div>` : '';
  }).join('');
  const myPlans = plans.filter(p => p.brand === S.brand);
  const plan = myPlans.find(p => p.id === S.planId) || myPlans[0];
  let planBox = '<div class="panel muted">ยังไม่มีแผนของแบรนด์นี้</div>';
  if (plan) {
    const [y, m] = plan.month.split('-').map(Number);
    const due = add(`${plan.month}-01`, -20);
    const left = daysBetween(TODAY, due);
    const late = plan.sentOn && daysBetween(plan.sentOn, due) < 0;
    const status = { draft: ['ร่าง', 't-idea'], sent: ['ส่งให้ Bay แล้ว', 't-review'], approved: ['อนุมัติแล้ว', 't-ready'] }[plan.status];
    const slotsHTML = plan.slots.length ? (plan.weeks || ['']).map((wn, wi) => {
      const ss = plan.slots.filter(s => s.w === wi);
      if (!ss.length) return '';
      return `<div class="week-h">สัปดาห์ ${wi + 1} · ${esc(wn)}</div>${ss.map(s => {
        const p = PILLARS[S.brand].find(x => x.id === s.pillar);
        return `<div class="slot"><div class="d"><b class="num">${D(s.date).getDate()}</b>${TH_WD[D(s.date).getDay()]}</div>
        <div class="stack" style="gap:6px"><div class="row">${s.ch.map(chTag).join('')}<span class="pill" style="background:color-mix(in srgb, ${p.c} 16%, transparent);color:${p.c}">${esc(p.name)}</span><span class="xs muted">${TYPES[s.type]}</span></div>
        <div class="hcv"><div><b>HOOK</b>${esc(s.hook)}</div><div><b>เนื้อหา</b>${esc(s.content) || '—'}</div><div><b>VISUAL</b>${esc(s.visual) || '—'}</div></div></div></div>`;
      }).join('')}`;
    }).join('') : `<p class="small muted">แผนเดือนนี้อนุมัติแล้ว ชิ้นงานทั้งหมดอยู่ในปฏิทิน</p>`;
    planBox = `<div class="panel stack">
      <div class="spread"><div><div class="eyebrow">แผนเดือน</div><h3 style="font-size:18px">${TH_MON_FULL[m - 1]} ${y + 543}</h3></div>
        <div class="row"><span class="pill ${status[1]}">${status[0]}</span>${late ? '<span class="pill t-bounce">ส่งช้า</span>' : ''}</div></div>
      ${plan.status === 'draft' ? `<div class="note ${left < 5 ? 'bad' : 'warn'}">ต้องส่งให้ Bay ภายใน <b>${fmt(due)}</b> (ล่วงหน้า 20 วัน) · <b class="num">เหลือ ${left} วัน</b></div>` : ''}
      ${plan.status === 'approved' ? `<div class="xs muted">ส่ง ${fmt(plan.sentOn)} · อนุมัติ ${fmt(plan.approvedOn)}</div>` : ''}
      ${slotsHTML}
      ${plan.log.length ? `<div><div class="eyebrow">เปลี่ยนหลังอนุมัติ (Bay เห็น)</div>${plan.log.map(l => `<div class="small">· ${esc(l)}</div>`).join('')}</div>` : ''}
      ${plan.status === 'draft' ? `<button class="btn primary" data-act="sendPlan">ส่งแผนให้ Bay</button>` : ''}
      ${plan.status === 'sent' ? (S.role === 'bay' ? `<button class="btn primary" data-act="approvePlan">อนุมัติแผนทั้งเดือน · สร้างการ์ด ${plan.slots.length} ใบ</button>` : `<div class="note lock">รอ Bay อนุมัติแผน</div>`) : ''}
    </div>`;
  }
  return `<div class="stack">
    <div><div class="eyebrow">${BRANDS[S.brand]}</div><h2>แผนคอนเทนต์</h2></div>
    <div class="panel stack"><div class="spread"><h3>ธีม 3 เดือนข้างหน้า</h3><span class="xs muted">ธีมคร่อมเดือนได้</span></div>
      <div class="timeline"><div class="tl-head"><span>ต.ค.</span><span>พ.ย.</span><span>ธ.ค.</span></div>${bars || '<p class="small muted">ยังไม่มีธีม</p>'}</div></div>
    <div class="seg" role="group" aria-label="เลือกแผน">${myPlans.map(p => { const [y, m] = p.month.split('-').map(Number); return `<button data-act="planPick" data-v="${p.id}" aria-pressed="${plan && plan.id === p.id}">${TH_MON[m - 1]} ${String(y + 543).slice(2)}</button>`; }).join('')}</div>
    ${planBox}
  </div>`;
}

/* ============================================================
   การกระทำ
   ============================================================ */
function autoToReview(it) {
  // Q-09b: ข้อความเสร็จ + ภาพเสร็จ → ส่งถึง Bay เลย ไม่มีขั้นคนเกลา
  if (it.agent === 'done' && (it.type === 'text' || it.imagesDone) && ['idea', 'work'].includes(it.stage)) {
    it.stage = 'review'; toast('ครบแล้ว · ส่งถึง Bay ตรวจเลย');
  } else if (['idea'].includes(it.stage) && it.agent !== 'idle') it.stage = 'work';
}
function runAgent(it) {
  it.stage = 'work';
  if (!it.content) {
    it.agent = 'asking';
    it.question = { q: `“${it.hook}” ชิ้นนี้อยากให้เล่าแบบไหน`, choices: ['ขายตรง บอกรุ่นและราคา', 'เล่าเรื่อง ไม่พูดราคา', 'ให้ความรู้ แล้วค่อยพาไปหาสินค้า'] };
  } else { it.agent = 'writing'; setTimeout(() => finishAgent(it), 1100); }
}
function finishAgent(it) {
  it.drafts = draftFor(it); it.agent = 'done'; autoToReview(it);
  if (S.screen === 'item' && S.itemId === it.id) render();
}

document.addEventListener('click', e => {
  if (!e.target.closest('#fabmenu, #fab')) $('#fabmenu').hidden = true;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  const it = S.itemId ? itemById(S.itemId) : null;
  switch (a) {
    case 'nav': go(v, { unlock: false, bounceRows: null, chatSec: null }); break;
    case 'brand': S.brand = v; S.f = { ch: '', pillar: '', campaign: '', product: '', owner: '' }; S.planId = plans.find(p => p.brand === v)?.id; if (['item', 'reviewItem', 'new'].includes(S.screen)) S.screen = S.back; render(); break;
    case 'view': S.view = v; render(); break;
    case 'colorBy': S.colorBy = v; render(); break;
    case 'calToday': S.cursor = TODAY; render(); break;
    case 'calPrev': case 'calNext': {
      const s = a === 'calNext' ? 1 : -1, d = D(S.cursor);
      if (S.view === 'month' || S.view === 'agenda') { d.setMonth(d.getMonth() + s, 1); S.cursor = K(d); }
      else S.cursor = add(S.cursor, s * ({ day: 1, '3day': 3, week: 7 }[S.view]));
      render(); break;
    }
    case 'open': e.preventDefault(); go('item', { itemId: b.dataset.id, back: S.screen === 'item' ? S.back : S.screen, unlock: false, tab: 'FB' }); break;
    case 'back': go(S.back || 'cal', { unlock: false, bounceRows: null }); break;
    case 'fab': $('#fabmenu').hidden = !$('#fabmenu').hidden; return;
    case 'goIdea': go('idea', { back: S.screen }); break;
    case 'new': go('new', { back: S.screen }); break;
    case 'tab': S.tab = v; render(); break;
    case 'answer':
      it.answer = v; it.content = v; it.agent = 'writing';
      S.pendingNote = null; render(); setTimeout(() => finishAgent(it), 1100);
      break;
    case 'runAgent': runAgent(it); render(); break;
    case 'simImages': it.images = img(Math.floor(Math.random() * 360), it.type === 'album' ? 4 : 1); it.imagesDone = true; autoToReview(it); render(); break;
    case 'imgUp': { const i = +b.dataset.i; [it.images[i - 1], it.images[i]] = [it.images[i], it.images[i - 1]]; render(); break; }
    case 'tick': it.comments[+b.dataset.i].done = b.checked; render(); break;
    case 'resubmit': it.versions.push({ v: it.version, when: fmt(TODAY), note: `ตีกลับ ${it.comments.length} ข้อ · แก้ครบ` }); it.version++; it.comments = []; it.stage = 'review'; toast('ส่งถึง Bay อีกครั้ง'); render(); break;
    case 'unlock': S.unlock = true; render(); break;
    case 'redo': { const x = S.tab === 'WEB' ? it.drafts.WEB : it.drafts[S.tab]; const fresh = draftFor(it); it.drafts[S.tab] = fresh[S.tab]; toast(`AI ร่าง ${CH[S.tab]} ใหม่แล้ว`); render(); void x; break; }
    case 'skip': it.place[+b.dataset.i].skip = 'Bay/ทีมเลือกไม่ลง'; checkPosted(it); render(); break;
    case 'posted': it.place[+b.dataset.i].url = 'แปะแล้ว'; checkPosted(it); render(); break;
    case 'copy': copy(v); break;
    case 'goReview': go('reviewItem', { itemId: b.dataset.id, bounceRows: null }); break;
    case 'approve': it.stage = 'ready'; toast('อนุมัติทั้งชุดแล้ว · พร้อมโพสต์'); go('review'); break;
    case 'startBounce': S.bounceRows = [{ target: 'ทั้งชิ้น', text: '' }]; render(); break;
    case 'addRow': S.bounceRows.push({ target: 'ทั้งชิ้น', text: '' }); render(); break;
    case 'cancelBounce': S.bounceRows = null; render(); break;
    case 'doBounce': {
      const rows = S.bounceRows.filter(r => r.text.trim());
      if (!rows.length) { toast('ต้องบอกเหตุผลอย่างน้อย 1 ข้อ คนแก้จะได้รู้ว่าต้องแก้อะไร'); break; }
      it.comments = rows.map(r => ({ ...r, done: false })); it.stage = 'bounce';
      S.pendingNote = { text: `จากที่พี่ติ: ${rows[0].text}`, from: it.hook };
      S.bounceRows = null; toast('ตีกลับแล้ว'); go('review'); break;
    }
    case 'nbYes': { const sc = $('#nb-scope')?.value || 'all'; notebook.push({ id: notebook.length + 1, text: S.pendingNote.text.replace('จากที่พี่ติ: ', ''), scope: sc, st: 'ok', from: `เหตุผลตีกลับ “${S.pendingNote.from}”` }); S.pendingNote = null; toast('จดลงสมุดแล้ว · agent ใช้ตั้งแต่งานถัดไป'); render(); break; }
    case 'nbNo': S.pendingNote = null; render(); break;
    case 'nbOk': notebook.find(n => n.id === +v).st = 'ok'; render(); break;
    case 'nbOff': notebook.find(n => n.id === +v).st = 'off'; render(); break;
    case 'planPick': S.planId = v; render(); break;
    case 'sendPlan': { const p = plans.find(x => x.id === S.planId); p.status = 'sent'; p.sentOn = TODAY; toast('ส่งแผนให้ Bay แล้ว'); render(); break; }
    case 'approvePlan': {
      const p = plans.find(x => x.id === S.planId); p.status = 'approved'; p.approvedOn = TODAY;
      p.slots.forEach((s, i) => items.push({
        id: `n${p.id}${i}`, brand: p.brand, type: s.type, title: s.hook, stage: 'idea', hook: s.hook, content: s.content, visual: s.visual,
        pillar: s.pillar, campaign: null, theme: s.date < '2026-11-16' ? 't1' : 't2', products: [], owner: 'ton', images: [], imagesDone: false,
        place: s.ch.map(c => ({ ch: c, date: s.date })), agent: 'idle', comments: [], versions: [], version: 1, firstComment: { FB: '', IG: '' },
      }));
      const n = p.slots.length; p.slots = [];
      toast(`อนุมัติแล้ว · สร้างการ์ดไอเดีย ${n} ใบในปฏิทิน`); render(); break;
    }
    case 'btab': S.brandTab = v; S.chatSec = null; render(); break;
    case 'interview': { const next = MODEL_SECTIONS.find(s => !brandModel[S.brand][s]); if (!next) { toast('ครบทุกหัวข้อแล้ว'); break; } S.chatSec = next; S.chat = []; render(); break; }
    case 'endInterview': S.chatSec = null; render(); break;
    case 'say': case 'sayTyped': {
      const ans = a === 'say' ? v : ($('#chat-in')?.value || '').trim(); if (!ans) break;
      brandModel[S.brand][S.chatSec] = { st: 'draft', text: ans };
      S.chat.push({ who: 'a', t: INTERVIEW[S.chatSec]?.q || S.chatSec }, { who: 'b', t: ans }, { who: 'a', t: `จดเป็นร่างหัวข้อ “${S.chatSec}” แล้ว · พี่ยืนยันทีหลังได้` });
      const next = MODEL_SECTIONS.find(s => !brandModel[S.brand][s]);
      S.chatSec = next || null; if (!next) toast('สัมภาษณ์ครบทุกหัวข้อแล้ว');
      render(); break;
    }
    case 'confirmSec': brandModel[S.brand][v].st = 'ok'; render(); break;
    case 'nType': NEW.type = v; render(); break;
    case 'nCh': NEW.ch = NEW.ch.includes(v) ? NEW.ch.filter(x => x !== v) : [...NEW.ch, v]; render(); break;
    case 'ideaGo': {
      const I = S.idea; if (!I.text.trim()) { toast('พิมพ์ไอเดียก่อน'); break; }
      I.phase = 'reading'; I.parsed = null; render();
      setTimeout(() => { I.parsed = parseIdea(I.text); I.phase = I.parsed.products.length ? 'asking' : 'writing'; render(); if (I.phase === 'writing') setTimeout(ideaFinish, 1100); }, 700);
      break;
    }
    case 'ideaAns': S.idea.answer = v; S.idea.phase = 'writing'; render(); setTimeout(ideaFinish, 1100); break;
    case 'ideaNote': notebook.push({ id: notebook.length + 1, text: S.idea.note, scope: S.brand, st: 'ok', from: 'Bay ตอบในช่องไอเดีย' }); S.idea.note = null; toast('จดลงสมุดแล้ว'); render(); break;
    case 'ideaReset': S.idea = { text: '', link: '', phase: 'idle' }; render(); break;
    case 'nProd': NEW.products = NEW.products.includes(v) ? NEW.products.filter(x => x !== v) : [...NEW.products, v]; render(); break;
  }
});

function ideaFinish() {
  const I = S.idea, P = I.parsed;
  const hookTopic = P.topic.replace(/^./, c => c.toUpperCase());
  const it = {
    id: 'q' + Date.now(), brand: S.brand, type: 'single', title: `${hookTopic}${P.products[0] ? ' · ' + P.products[0] : ''}`, stage: 'idea',
    hook: P.products[0] ? `${P.products[0]} ความ ${hookTopic} ที่อยู่ได้ทุกยุค` : hookTopic,
    content: I.answer ? `${I.answer} คือเสน่ห์ ${hookTopic} ของรุ่นนี้` : hookTopic, visual: I.link ? 'ภาพที่ Bay แนบมา' : '',
    pillar: P.pillar, campaign: null, theme: '', products: P.products, owner: 'ton', offPlan: true,
    images: I.link ? img(24, 1) : [], imagesDone: !!I.link,
    place: P.ch.map(c => ({ ch: c, date: P.date })), comments: [], versions: [], version: 1, firstComment: { FB: '', IG: '' }, agent: 'done',
    source: I.text,
  };
  it.drafts = draftFor(it); items.push(it); autoToReview(it);
  I.itemId = it.id; I.phase = 'done';
  I.note = I.answer && P.products[0] ? `${P.products[0]} = ${P.topic} เพราะ${I.answer}` : null;
  S.cursor = P.date;
  if (S.screen === 'idea') render();
}
function checkPosted(it) {
  const live = it.place.filter(p => !p.skip);
  if (it.stage === 'ready' && live.length && live.every(p => p.url)) { it.stage = 'posted'; toast('ลงครบทุกช่องทาง · โพสต์แล้ว'); }
}
function copy(text) {
  if (!text) { toast('ยังไม่มีข้อความให้คัดลอก'); return; }
  try { navigator.clipboard.writeText(text).then(() => toast('คัดลอกแล้ว'), () => toast(`คัดลอกไม่ได้ · เลือกข้อความเอง: ${text}`)); }
  catch (e) { toast(`คัดลอกไม่ได้ · เลือกข้อความเอง: ${text}`); }
}

document.addEventListener('input', e => {
  const t = e.target, it = S.itemId ? itemById(S.itemId) : null;
  if (t.dataset.draft && it) {
    const [ch, key] = t.dataset.draft.split('.');
    it.drafts[ch][key] = t.value; it.drafts[ch].human = true;
    if (S.unlock && ['ready', 'posted'].includes(it.stage)) {
      it.versions.push({ v: it.version, when: fmt(TODAY), note: 'แก้หลังอนุมัติ · อนุมัติเป็นโมฆะ' });
      it.version++; it.stage = 'review'; S.unlock = false; toast('การอนุมัติเป็นโมฆะ · กลับไปรอ Bay ตรวจ');
      render(); const el = document.getElementById(t.id); if (el) { el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); }
    }
    const lab = t.closest('label')?.querySelector('.counter');
    if (lab) { const max = { 'WEB.title': LIMIT.WEBtitle, 'WEB.meta': LIMIT.WEBmeta }[t.dataset.draft] || LIMIT[ch]; if (max) lab.outerHTML = counter(t.value.length, max); }
  }
  if (t.dataset.idea) S.idea[t.dataset.idea] = t.value;
  if (t.dataset.fc && it) it.firstComment[t.dataset.fc] = t.value;
  if (t.dataset.brow !== undefined) S.bounceRows[+t.dataset.brow][t.dataset.k] = t.value;
  if (t.dataset.pb) playbooks[S.brand][t.dataset.pb] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, it = S.itemId ? itemById(S.itemId) : null;
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.value; render(); }
  if (t.hasAttribute('data-role')) { S.role = t.value; try { localStorage.setItem('cc-mock-role', t.value); } catch (x) {} render(); }
  if (t.dataset.pdate !== undefined && it && t.value) { it.place[+t.dataset.pdate].date = t.value; toast(`ย้าย ${it.place[+t.dataset.pdate].ch} ไป ${fmt(t.value)}`); }
  if (t.dataset.brow !== undefined) S.bounceRows[+t.dataset.brow][t.dataset.k] = t.value;
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'newForm') return;
  e.preventDefault();
  const hook = $('#n-hook').value.trim();
  if (!hook) { toast('ใส่ hook ก่อน agent จะได้รู้ว่าจะเล่าอะไร'); return; }
  const date = $('#n-date').value || TODAY;
  const it = {
    id: 'x' + Date.now(), brand: S.brand, type: NEW.type, title: hook, stage: 'idea', hook,
    content: $('#n-content').value.trim(), visual: $('#n-visual').value.trim(),
    pillar: $('#n-pillar').value, theme: $('#n-theme').value, offPlan: true, campaign: $('#n-camp').value || null,
    products: [...NEW.products], owner: $('#n-owner').value, images: [], imagesDone: NEW.type === 'text',
    place: NEW.ch.map(c => ({ ch: c, date })), comments: [], versions: [], version: 1, firstComment: { FB: '', IG: '' }, agent: 'idle',
  };
  items.push(it); runAgent(it);
  NEW.products = [];
  go('item', { itemId: it.id, back: 'cal', tab: NEW.ch[0] });
});

/* ลากการ์ดในปฏิทินเดือน (คอม) */
let drag = null;
document.addEventListener('dragstart', e => { const c = e.target.closest('.mcard'); if (!c) return; drag = { id: c.dataset.id, from: c.dataset.date }; e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const cell = e.target.closest('.mcell'); if (!cell || !drag) return; e.preventDefault(); document.querySelectorAll('.mcell.drop').forEach(x => x.classList.remove('drop')); cell.classList.add('drop'); });
document.addEventListener('drop', e => {
  const cell = e.target.closest('.mcell'); if (!cell || !drag) return; e.preventDefault();
  const it = itemById(drag.id), to = cell.dataset.date;
  it.place.forEach(p => { if (p.date === drag.from) p.date = to; });
  toast(`ย้าย “${it.hook}” ไป ${fmt(to)}`); drag = null; render();
});
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.mcell.drop').forEach(x => x.classList.remove('drop')); });

render();
})();
</script>
