<style>
/* Layout: sticky top bar (side tabs + timeline) → two columns: screen list + notes | phone frame. Stacks on phone. Colors from docs/brand (CI) · no green in brand set, semantic ok-color only for status */
:root{
  --bg:#F7F8F8; --surface:#FFFFFF; --fg:#1F2A36; --muted:#66707C; --line:#E1E5E8; --soft:#EEF2F4;

  --ok:#3F6F4F; --ok-bg:#E7F0EA; --warn:#9A6B23; --warn-bg:#F6EFE3; --bad:#9B3B32; --bad-bg:#F6E6E3;
  --phone:#FFFFFF; --phone-edge:#2F4554; --on-navy:#FFFFFF;
  --th:"Noto Sans Thai",system-ui,sans-serif; --en:"Montserrat","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A222B; --surface:#222D38; --fg:#E7EBEE; --muted:#9AA6B2; --line:#34424F; --soft:#2A3743;
  --navy:#A9C4DA; --slate:#13202B; --aqua:#83B7BF; --aqua-soft:#24393D; --taupe:#C2B8A6; --taupe-soft:#353029;
  --ok:#86B894; --ok-bg:#22362A; --warn:#D9A75E; --warn-bg:#3A3122; --bad:#E39187; --bad-bg:#3E2623;
  --phone:#1F2933; --phone-edge:#0E161D; --on-navy:#13202B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A222B; --surface:#222D38; --fg:#E7EBEE; --muted:#9AA6B2; --line:#34424F; --soft:#2A3743;
  --navy:#A9C4DA; --slate:#13202B; --aqua:#83B7BF; --aqua-soft:#24393D; --taupe:#C2B8A6; --taupe-soft:#353029;
  --ok:#86B894; --ok-bg:#22362A; --warn:#D9A75E; --warn-bg:#3A3122; --bad:#E39187; --bad-bg:#3E2623;
  --phone:#1F2933; --phone-edge:#0E161D; --on-navy:#13202B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--th);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.en{font-family:var(--en)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.brandrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brandrow .mark{font-family:var(--en);letter-spacing:.32em;font-size:12px;color:var(--navy)}
.brandrow .mark b{font-weight:600}
.brandrow h1{margin:0;font-size:17px;font-weight:600;color:var(--fg)}
.brandrow .tag{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy);font-weight:500}
.tl{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tl button{flex:none;border:0;background:none;padding:4px 10px 6px;display:grid;justify-items:start;gap:2px;border-bottom:2px solid var(--line);text-align:left}
.tl button .d{font-family:var(--en);font-size:11px;letter-spacing:.08em;color:var(--taupe);text-transform:uppercase}
.tl button .t{font-size:13px;color:var(--muted);white-space:nowrap}
.tl button[aria-pressed="true"]{border-bottom-color:var(--navy)}
.tl button[aria-pressed="true"] .t{color:var(--fg);font-weight:500}
.tl button.past .t{color:var(--fg)}
.tl-label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* page */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:28px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.phone-col{order:-1}}
@media (max-width:900px){.top{position:static}}
.side-head{display:grid;gap:4px;margin-bottom:14px}
.eyebrow{font-family:var(--en);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);margin:0}
.side-head h2{margin:0;font-size:22px;font-weight:600;color:var(--navy);text-wrap:balance}
.side-head p{margin:0;color:var(--muted);max-width:64ch}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-align:left;width:100%}
.item[aria-current="true"]{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua)}
.item b{font-weight:500}
.item .who{font-size:12px;color:var(--muted)}
.item .req{font-family:var(--en);font-size:11px;color:var(--taupe);white-space:nowrap}
.notes{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.notes h3{margin:0;font-size:15px;color:var(--navy)}
.notes ul{margin:0;padding-left:18px;display:grid;gap:4px}
.notes .q{background:var(--warn-bg);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px}
.notes .q b{color:var(--warn)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.aqua{background:var(--aqua-soft);color:var(--navy)}

/* phone */
.phone-col{position:sticky;top:150px}
@media (max-width:900px){.phone-col{position:static}}
.phone{background:var(--phone);border:10px solid var(--phone-edge);border-radius:34px;overflow:hidden;max-width:392px;margin:0 auto;box-shadow:0 18px 40px rgba(20,30,40,.18)}
.phone .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 4px;font-family:var(--en);font-size:11px;color:var(--muted)}
.screen{height:min(720px,calc(100vh - 210px));overflow-y:auto;overscroll-behavior:contain;background:var(--phone)}
@media (max-width:900px){.screen{height:auto;max-height:none}}
.phone-cap{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* in-phone UI */
.app{display:grid;gap:14px;padding:14px 16px 22px}
.app-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1}
.app-h .back{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.app-h b{font-size:15px;font-weight:600}
.app-h .sub{font-size:12px;color:var(--muted)}
.logo{font-family:var(--en);letter-spacing:.3em;font-size:12px;color:var(--navy);text-align:center;line-height:1.3}
.logo b{font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.card h4{margin:0;font-size:14px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h4 .en{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:500}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .l{min-width:0}
.small{font-size:13px;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.big{font-size:22px;font-weight:600;color:var(--navy)}
.hello{font-size:20px;font-weight:600;color:var(--navy);margin:0}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);border-radius:10px;padding:10px 14px;font-weight:500;width:100%}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);width:100%}
.check{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.check input{margin-top:4px;width:16px;height:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);text-align:left;display:grid;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.opt b{font-size:14px;font-weight:500}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps div{display:grid;gap:4px;font-size:11px;color:var(--muted);text-align:center}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps .done i{background:var(--navy)}
.steps .now i{background:var(--aqua)}
.steps .now,.steps .done{color:var(--fg)}
.pic{border-radius:10px;overflow:hidden;background:var(--aqua-soft);display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;position:relative;color:var(--navy)}
.pic svg{width:70%;height:auto}
.pic .cap{position:absolute;left:8px;bottom:6px;font-size:11px;background:var(--surface);color:var(--muted);padding:1px 6px;border-radius:6px}
.pic.sm{aspect-ratio:1;width:64px;flex:none}
.pic.sm svg{width:80%}
.sus{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;text-align:center}
.sus .tagl{font-family:var(--en);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.sus .proof{font-size:13px;color:var(--fg)}
.sus .proof b{font-weight:500;color:var(--navy)}
.sus.band{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--taupe-soft);text-align:left}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.cert{border:1px solid var(--taupe);border-radius:4px;padding:18px 16px;display:grid;gap:12px;text-align:center;background:var(--surface)}
.cert .ttl{font-family:var(--en);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe)}
.cert .nm{font-size:19px;font-weight:600;color:var(--navy)}
.cert .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.cert .grid2 div{border-top:1px solid var(--line);padding-top:6px;font-size:13px}
.cert .grid2 span{display:block;font-size:11px;color:var(--muted)}
.label{border:1px dashed var(--muted);border-radius:6px;padding:12px;display:grid;gap:6px;background:var(--surface);font-size:13px}
.qr{width:64px;height:64px;background:
  linear-gradient(90deg,var(--fg) 12%,transparent 12% 25%,var(--fg) 25% 37%,transparent 37% 62%,var(--fg) 62% 75%,transparent 75% 88%,var(--fg) 88%),
  linear-gradient(var(--surface) 0 0);border:4px solid var(--surface);outline:1px solid var(--line);opacity:.85}
.chat{background:var(--soft);display:grid;gap:10px;padding:14px}
.bubble{background:var(--surface);border-radius:14px 14px 14px 4px;padding:10px 12px;max-width:88%;font-size:14px;display:grid;gap:8px}
.bubble .link{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bubble .link .lt{padding:8px 10px;display:grid;gap:2px}
.funnel{display:grid;gap:6px}
.funnel .f{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.funnel .f i{display:block;height:14px;border-radius:3px;background:var(--aqua)}
.funnel .f .bar{background:var(--soft);border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:10px;display:grid;gap:2px}
.kpi b{font-size:20px;color:var(--navy);font-weight:600}
.kpi span{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--slate);color:#FFFFFF;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px}

/* wide (overview / sustain) */
.wide{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.panel h3{margin:0;font-size:16px;color:var(--navy)}
.panel p{margin:0;max-width:72ch}
.lanes{display:grid;grid-template-columns:120px repeat(7,minmax(120px,1fr));gap:6px;min-width:1000px;font-size:13px}
.lanes .h{font-family:var(--en);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);padding:4px}
.lanes .who{font-weight:500;color:var(--navy);padding:8px 4px}
.lanes .c{background:var(--soft);border-radius:8px;padding:8px;display:grid;gap:3px}
.lanes .c.on{background:var(--aqua-soft);outline:1px solid var(--aqua)}
.lanes .c a{color:var(--navy);font-size:12px}
.lanes .c.none{background:transparent}
.qs{display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding-top:10px}
.qrow .id{font-family:var(--en);font-weight:600;color:var(--warn);font-size:13px}
.qrow p{margin:0}
.qrow .prop{color:var(--muted);font-size:14px}
.taglines{display:grid;gap:8px}
.tagopt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;align-items:start}
.tagopt[data-on="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.tagopt .en{font-size:15px;font-weight:500;color:var(--navy);letter-spacing:.02em}
.stk{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;align-items:start}
@media (max-width:640px){.stk{grid-template-columns:minmax(0,1fr)}.qrow{grid-template-columns:minmax(0,1fr)}}
.stk textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);min-height:58px;resize:vertical}
.stk .who b{display:block;color:var(--navy);font-weight:500}
.stk .who span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

function applyStage(n){
  S.stage = n;
  const t0 = S.trees;
  if (n >= 1 && !S.submitted){
    S.submitted = true; S.consent1 = true; S.consent2 = true;
    t0[0].name = t0[0].name || 'เจ้าอ้วน'; t0[1].name = t0[1].name || 'น้องวีท';
    logEvents();
  }
  if (n === 0){ S.submitted=false; S.consent1=false; S.consent2=false; S.pixel=[]; S.conv=[]; t0.forEach(t=>{t.name='';}); }
  t0.forEach(t=>{
    t.status = n>=5 ? 'ลงดินแล้ว' : n>=2 ? 'เพาะแล้ว' : n>=1 ? 'รอเพาะ' : 'รอเลือก';
    t.seedPhoto = n>=2; t.gps = n>=5 ? PLOTS.find(p=>p.id===t.plot).gps : null; t.replant=false;
  });
  S.produced = n>=3;
  S.paid = n>=3 ? 'ชำระครบ' : 'มัดจำ 50%';
  const keyed = n>=4;
  ['U0000412','U0000413','U0000414'].forEach((u,i)=>{
    S.craft[u] = keyed ? Object.fromEntries(PARTS.map((p,j)=>[p, CRAFT[(i+j)%CRAFT.length].id])) : {};
  });
  S.ship.step = n>=4 ? 3 : n>=3 ? 2 : n>=0 ? 1 : 0;
  S.ship.track = n>=3 ? 'LLM-8842 1907' : '';
  S.annual = n>=6;
}

function copy(text){
  const done = () => toast('คัดลอกแล้ว · วางใน LINE ได้เลย');
  try { navigator.clipboard.writeText(text).then(done, ()=>fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done(); }
}
function fill(str){ const trees = BASE.treesMonth + (S.submitted?2:0); return str.replace('{trees}', trees).replace('{shared}', BASE.shared + (S.ship.shared&&S.stage>=4?1:0)); }

function render(){
  // tabs
  $('#tabs').innerHTML = SIDES.map(s=>`<button class="tab" role="tab" aria-selected="${S.side===s.id}" data-side="${s.id}">${s.th}</button>`).join('');
  $('#timeline').innerHTML = STAGES.map((s,i)=>`<button aria-pressed="${S.stage===i}" class="${i<S.stage?'past':''}" data-stage="${i}"><span class="d">${s.d}</span><span class="t">${s.t}</span></button>`).join('');
  $('#tl-now').textContent = STAGES[S.stage].d + ' · ' + STAGES[S.stage].t;
  const main = $('#main');
  const keepScroll = document.querySelector('.screen')?.scrollTop || 0;
  if (S.side==='overview'){ main.innerHTML = viewOverview(); return; }
  if (S.side==='sustain'){ main.innerHTML = viewSustain(); return; }
  const list = SCREENS.filter(x=>x.side===S.side);
  if (!S.screen || !list.find(x=>x.id===S.screen)) S.screen = list[0].id;
  const cur = SCREENS.find(x=>x.id===S.screen);
  const intro = SIDE_INTRO[S.side];
  main.innerHTML = `<div class="cols">
    <div style="min-width:0">
      <div class="side-head"><p class="eyebrow">${list.length} หน้า</p><h2>${intro[0]}</h2><p>${intro[1]}</p></div>
      <ul class="list">${list.map(x=>`<li><button class="item" data-screen="${x.id}" aria-current="${x.id===S.screen}"><span><b>${x.t}</b><br><span class="who">${x.who}</span></span><span class="req">${x.req}</span></button></li>`).join('')}</ul>
      <div class="notes"><h3>ลองดูอะไรในหน้า "${cur.t}"</h3><ul>${(NOTES[cur.id]||[]).map(n=>`<li>${n}</li>`).join('')}</ul>
      <span class="small">อ้างอิง: ${cur.req} ใน 2-requirements.md</span></div>
    </div>
    <div class="phone-col"><div class="phone"><div class="bar"><span>9:41</span><span>${cur.side==='customer'?'chawcher.com':'chawcher-os'}</span></div><div class="screen" id="screen">${RENDER[cur.id]()}</div></div>
      <div class="phone-cap">${cur.t} · ${cur.who}</div></div>
  </div>`;
  if (location.hash.slice(1) !== cur.id){ try{ history.replaceState(null,'','#'+cur.id); }catch(e){} }
  if (render._same) $('#screen').scrollTop = keepScroll;
  render._same = false;
}
function go(id){ const sc = SCREENS.find(x=>x.id===id); if(!sc) return; S.side = sc.side; S.screen = id; render(); const s=$('#screen'); if(s) s.scrollTop=0; if (window.innerWidth<=900){ const p=document.querySelector('.phone'); p&&p.scrollIntoView({block:'start'}); } }
function rerender(){ render._same = true; render(); }

/* ============ เหตุการณ์ ============ */
document.addEventListener('click', e=>{
  const b = e.target.closest('button,a,[data-open]');
  if (!b) return;
  const d = b.dataset;
  if (d.side){ S.side=d.side; S.screen=null; render(); if(S.side==='overview'||S.side==='sustain'){ try{history.replaceState(null,'','#'+S.side);}catch(err){} } return; }
  if (d.stage!==undefined){ applyStage(+d.stage); rerender(); toast('ไปที่ '+STAGES[S.stage].d+' · '+STAGES[S.stage].t); return; }
  if (d.screen){ go(d.screen); return; }
  if (d.open){ e.preventDefault(); go(d.open); return; }
  if (d.go){ go(d.go); return; }
  if (d.toast){ toast(d.toast); return; }
  if (d.share!==undefined){ copy('chawcher.com/c/CCU-2026-0412'); return; }
  if (d.sp){ const [i,id]=d.sp.split(':'); S.trees.forEach((t,j)=>{ if(+i===j || S.sameAll) t.species=id; }); rerender(); return; }
  if (d.pl){ const [i,id]=d.pl.split(':'); S.trees.forEach((t,j)=>{ if(+i===j || S.sameAll) t.plot=id; }); rerender(); return; }
  if (d.submit!==undefined){
    S.contact = $('#ct').value; S.consent1 = $('#cs1').checked; S.consent2 = $('#cs2').checked;
    const first = !S.submitted;
    S.submitted = true;
    S.trees.forEach(t=>{ if(t.status==='รอเลือก') t.status='รอเพาะ'; });
    if (S.stage<1) S.stage = 1;
    logEvents();
    toast(first ? 'บันทึกแล้ว · เราจะเพาะภายใน 7 วัน แล้วส่งรูปให้' : 'บันทึกแล้ว');
    go('c-home'); return;
  }
  if (d.adj){ S.treeAdjust = Math.max(-ORDER.lines.filter(l=>COUNTED[l.cat]).length, Math.min(1, S.treeAdjust + +d.adj)); if(S.trees.length<treesForOrder()) S.trees.push({tr:'TR-0414', line:2, species:'pradu', plot:'bkj', name:'', status:S.submitted?'รอเพาะ':'รอเลือก', seedPhoto:false, gps:null, replant:false}); rerender(); return; }
  if (d.copylink!==undefined){ copy(`สวัสดีค่ะ ${ORDER.customer} ออเดอร์ ${ORDER.no} เข้าคิวผลิตแล้ว ดูสถานะและเลือกต้นไม้ได้ที่ chawcher.com/my/${S.linkToken}`); return; }
  if (d.relink!==undefined){ S.linkToken = Math.random().toString(36).slice(2,12); rerender(); toast('ออกลิงก์ใหม่แล้ว · ลิงก์เดิมใช้ไม่ได้ทันที'); return; }
  if (d.qtab){ S.queueTab=d.qtab; rerender(); return; }
  if (d.qcopy){ copy(d.qcopy); return; }
  if (d.qsent){ S.sent[d.qsent]=true; rerender(); toast('ออกจากรายการแล้ว · เก็บว่าใครส่ง เมื่อไหร่'); return; }
  if (d.cat){ COUNTED[d.cat]=!COUNTED[d.cat]; rerender(); return; }
  if (d.sp4){ const a=S.species4, i=a.indexOf(d.sp4); if(i>=0){ if(a.length>2) a.splice(i,1); } else if(a.length<4) a.push(d.sp4); else toast('เลือกได้สูงสุด 4 พันธุ์'); rerender(); return; }
  if (d.qcp!==undefined){ S.qcPhoto=+d.qcp; rerender(); toast(+d.qcp? 'ลูกค้าจะเห็นรูป '+d.qcp : 'ลูกค้าจะไม่เห็นรูป'); return; }
  if (d.cu){ S.craftUnit=d.cu; rerender(); return; }
  if (d.crsave!==undefined){ const u=S.craftUnit; if(!S.craft[u]) S.craft[u]={}; PARTS.forEach(p=>{ const v=$('#cr-'+p).value; if(v) S.craft[u][p]=v; }); rerender(); toast(craftDone(u)?'บันทึกแล้ว · ใบรับรองและป้ายมีชื่อช่างแล้ว':'บันทึกบางส่วน · ยังอยู่ในรายการ'); return; }
  if (d.lf){ S.label[d.lf]=!S.label[d.lf]; rerender(); return; }
  if (d.seedok){ const t=S.trees.find(x=>x.tr===d.seedok); t.status='เพาะแล้ว'; t.seedPhoto=true; rerender(); toast('เพาะแล้ว · หน้าลูกค้าขึ้นรูปกล้าแล้ว'); return; }
  if (d.plant){ const t=S.trees.find(x=>x.tr===d.plant); t.status='ลงดินแล้ว'; t.gps=pl(t.plot).gps; t.replant=false; rerender(); toast('ลงดินแล้ว · จับพิกัด '+t.gps); return; }
  if (d.dead){ const t=S.trees.find(x=>x.tr===d.dead); t.replant=true; t.status='เพาะแล้ว'; rerender(); toast('บันทึกต้นตาย · ปลูกซ่อมเลขเดิม '+t.tr); return; }
  if (d.annual!==undefined){ S.annual=true; rerender(); toast('อัปรูปแปลงแล้ว · ทุกต้นในบางกระเจ้าเห็นรูปนี้'); return; }
  if (d.shipsave!==undefined){ S.ship.provider=$('#prov').value; S.ship.track=$('#trk').value.trim(); S.ship.shared=$('#shr').checked; rerender(); toast('บันทึกแล้ว'+(S.ship.track?' · ลูกค้าเห็นปุ่มติดตาม':'')); return; }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='sameAll'){ S.sameAll=el.checked; if(el.checked){ S.trees.forEach(t=>{t.species=S.trees[0].species; t.plot=S.trees[0].plot;}); } rerender(); }
  if (el.id==='pv1'){ S.consent1=el.checked; toast(el.checked?'รับข่าวต้นไม้':'หยุดส่งข่าวต้นไม้แล้ว'); }
  if (el.id==='pv2'){ S.consent2=el.checked; if(S.submitted) logEvents(); if(!el.checked) S.conv.push({to:'Meta / Google', what:'ลูกค้าถอนยินยอม · หยุดส่งต่อจากนี้', st:'หยุดส่ง'}); toast(el.checked?'ยินยอมแล้ว':'ถอนแล้ว · หยุดส่งให้ Meta/Google'); }
  if (el.id==='pv3'){ S.certPublic=el.checked; toast(el.checked?'เปิดใบรับรองแล้ว':'ปิดใบรับรองแล้ว'); }
  if (el.id==='cbn'){ S.carbon=el.checked; toast(el.checked?'เปิดประมาณการคาร์บอน (ค่าต่ำ)':'ปิดตาม O6'); }
  if (el.name==='tg'){ S.tagline=el.value; rerender(); }
  if (el.dataset.seed){ const t=S.trees.find(x=>x.tr===el.dataset.seed); t.status='เพาะแล้ว'; t.seedPhoto=true; rerender(); toast('เพาะแล้ว · ได้รูปจากเครื่องคุณ'); }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.dataset.nm!==undefined){ S.trees[+el.dataset.nm].name = el.value; }
  if (el.id==='adr'){ S.adjustReason = el.value; }
  if (el.dataset.stk){ STAKE.find(s=>s.id===el.dataset.stk).text = el.value; }
});
function fromHash(){
  const h = location.hash.slice(1);
  if (SCREENS.find(x=>x.id===h)){ S.side = SCREENS.find(x=>x.id===h).side; S.screen = h; }
  else if (SIDES.find(s=>s.id===h)){ S.side = h; }
}
window.addEventListener('hashchange', ()=>{ fromHash(); render(); });
applyStage(0); fromHash(); render();
</script>
