<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B4368">
<link rel="icon" href="/pos/logo.svg">
<title>CHAW CHER POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Noto+Sans+Thai:wght@400;500&display=swap">
<style>
[hidden] { display: none !important; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: booth POS. Tabs: ขาย (product grid + cart, side by side on iPad, stacked on phone) · ยอดขาย · หลังบ้าน (owner). CHAW CHER CI. */
:root {
  --bg: #F7F8F8; --panel: #FFFFFF; --ink: #2F4554; --muted: #5B6670; --line: #DDE1E3;
  --navy: #2B4368; --on-navy: #F7F8F8; --aqua: #83B7BF; --aqua-soft: #E4EEF0; --taupe: #958C7B;
  --ok: #2E6B4F; --ok-bg: #E3EFE8; --warn: #7A5A12; --warn-bg: #F6EEDB; --bad: #9B2C2C; --bad-bg: #F6E3E3;
  --font: "Montserrat", "Noto Sans Thai", "Sukhumvit Set", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1C2A33; --panel: #24343F; --ink: #E6ECEF; --muted: #A3B1BA; --line: #344853;
  --navy: #A9CDD3; --on-navy: #1C2A33; --aqua: #83B7BF; --aqua-soft: #2C4250; --taupe: #B8AE9C;
  --ok: #8FD0AE; --ok-bg: #22392F; --warn: #E8CF8F; --warn-bg: #3A321E; --bad: #F0A3A3; --bad-bg: #432828; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1C2A33; --panel: #24343F; --ink: #E6ECEF; --muted: #A3B1BA; --line: #344853;
  --navy: #A9CDD3; --on-navy: #1C2A33; --aqua: #83B7BF; --aqua-soft: #2C4250; --taupe: #B8AE9C;
  --ok: #8FD0AE; --ok-bg: #22392F; --warn: #E8CF8F; --warn-bg: #3A321E; --bad: #F0A3A3; --bad-bg: #432828; color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { margin: 0; font-weight: 500; }
p { margin: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { height: 46px; width: auto; color: var(--navy); flex: none; }
.brand b { letter-spacing: .22em; font-weight: 500; color: var(--navy); font-size: 15px; }
.brand span { color: var(--taupe); font-size: 12px; letter-spacing: .1em; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--navy); color: var(--on-navy); }
.mode { font-size: 12.5px; border-radius: 999px; padding: 3px 10px; }
.mode.ok { background: var(--ok-bg); color: var(--ok); } .mode.warn { background: var(--warn-bg); color: var(--warn); }

button { font: inherit; cursor: pointer; }
.btn { border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 500; border: 1px solid var(--navy); background: var(--navy); color: var(--on-navy); }
.btn.ghost { background: transparent; color: var(--navy); }
.btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* sell */
.sell { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.cats button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; }
.cats button[aria-pressed="true"] { border-color: var(--navy); color: var(--navy); background: var(--aqua-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px; margin-top: 8px; }
.prod { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; color: var(--ink); min-height: 92px; align-content: start; }
.prod .ph { width: 100%; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; overflow: hidden; margin-bottom: 4px; }
.prod .ph img { width: 100%; height: 100%; object-fit: contain; }
.prod .ph.none { background: var(--aqua-soft); color: var(--muted); font-size: 12px; letter-spacing: .2em; }
.prod:active { transform: scale(.98); }
.prod b { font-weight: 500; font-size: 14.5px; line-height: 1.35; }
.prod .v { font-size: 12.5px; color: var(--muted); }
.prod .p { font-size: 16px; color: var(--navy); font-weight: 500; margin-top: auto; }
.custom { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 8px; align-items: end; }

.cart { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); }
@media (max-width: 860px) { .cart { position: static; } }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line .nm { font-size: 14.5px; }
.line .nm small { color: var(--muted); display: block; font-size: 12.5px; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1; }
.qty span { min-width: 22px; text-align: center; }
.line .amt { grid-column: 2; text-align: right; font-size: 14.5px; }
.lineprice { grid-column: 1; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.lineprice input { width: 110px; padding: 4px 8px; font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
.disc { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; align-items: end; padding: 10px; border-radius: 10px; background: var(--aqua-soft); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { flex: 1; border: 0; padding: 9px 0; background: transparent; color: var(--ink); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.sum { display: grid; gap: 4px; font-size: 14.5px; }
.sum div { display: flex; justify-content: space-between; }
.sum .total { font-size: 24px; color: var(--navy); font-weight: 500; padding-top: 6px; border-top: 1px solid var(--line); }
.pays { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.shipbox { display: grid; gap: 8px; }
.shipbox textarea { min-height: 72px; font-size: 16px; }
.pays button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 0; border-radius: 10px; font-size: 14px; }
.pays button[aria-pressed="true"] { border-color: var(--navy); background: var(--aqua-soft); color: var(--navy); font-weight: 500; }
details.more summary { cursor: pointer; color: var(--navy); font-size: 14px; }
details.more > div { display: grid; gap: 8px; margin-top: 8px; }

/* reports */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi span { display: block; font-size: 12.5px; color: var(--muted); }
.kpi b { font-weight: 500; font-size: 20px; color: var(--navy); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters label { width: 170px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
td.r, th.r { text-align: right; }
tr.void td { color: var(--muted); text-decoration: line-through; }
.tag { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--aqua-soft); white-space: nowrap; }
.tag.bad { background: var(--bad-bg); color: var(--bad); text-decoration: none; display: inline-block; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { min-height: 90px; resize: vertical; font-size: 13px; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgba(20, 30, 40, .45); }
.dlg { padding: 18px; display: grid; gap: 12px; }
.dlg .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.receipt { font-size: 14px; display: grid; gap: 4px; }
.receipt .ln { display: flex; justify-content: space-between; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: var(--on-navy); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .prod:active { transform: none; } }

.overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.overlay .box { width: min(360px, 100%); display: grid; gap: 14px; text-align: center; }
.overlay .logo-big { width: 92px; height: auto; color: var(--navy); margin: 0 auto; }
.overlay input { text-align: center; font-size: 24px; letter-spacing: .3em; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
</style>
</head>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const baht = (n) => (Math.round(n * 100) / 100).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const pad = (n) => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const LS = 'chawcher-pos-web-v1';
function lsGet(k, d) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2000); }

let catalog = DEFAULT_CATALOG, cat = 'ทั้งหมด';

$('seller').value = lsGet('-seller', '');

// ---------- sell view ----------
function renderCats() {
  const cats = ['ทั้งหมด', ...new Set(catalog.map(p => p.cat))];
  $('cats').innerHTML = cats.map(c => `<button type="button" aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const list = catalog.map((p, i) => ({ ...p, i })).filter(p => cat === 'ทั้งหมด' || p.cat === cat);
  $('grid').innerHTML = list.map(p => `<button type="button" class="prod" data-add="${p.i}">${p.img ? `<span class="ph"><img src="${esc(p.img)}" alt="" loading="lazy"></span>` : '<span class="ph none">CHAW CHER</span>'}<b>${esc(p.name)}</b>${p.v ? `<span class="v">${esc(p.v)}</span>` : ''}<span class="p num">฿${baht(p.price)}</span></button>`).join('');
}
function addLine(name, v, price) {
  const ex = cart.find(l => l.name === name && l.v === v && l.price === price);
  if (ex) ex.qty++; else cart.push({ name, v, price, qty: 1 });
  saveCart(); renderCart(); toast('เพิ่ม ' + name + (v ? ' ' + v : ''));
}
function totals(lines, dt, dv) {
  const sub = lines.reduce((s, l) => s + l.price * l.qty, 0);
  let d = +dv || 0; if (dt === 'pct') d = sub * Math.min(d, 100) / 100;
  d = Math.min(Math.max(d, 0), sub);
  return { sub, disc: Math.round(d * 100) / 100, total: Math.round((sub - d) * 100) / 100 };
}
function renderCart() {
  $('lines').innerHTML = cart.length ? cart.map((l, i) => `
    <div class="line">
      <div class="nm">${esc(l.name)}${l.v ? `<small>${esc(l.v)}</small>` : ''}</div>
      <div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="ลดจำนวน">−</button><span class="num">${l.qty}</span><button type="button" data-q="${i}" data-d="1" aria-label="เพิ่มจำนวน">+</button></div>
      <div class="lineprice">ราคา/ชิ้น <input data-lp="${i}" inputmode="numeric" value="${l.price}" aria-label="ราคาต่อชิ้น ${esc(l.name)}"></div>
      <div class="amt num">฿${baht(l.price * l.qty)}</div>
    </div>`).join('') : '<p class="empty">แตะสินค้าทางซ้ายเพื่อเพิ่มลงบิล</p>';
  const t = totals(cart, discType, $('discVal').value);
  $('sSub').textContent = '฿' + baht(t.sub); $('sDisc').textContent = t.disc ? '−฿' + baht(t.disc) : '฿0'; $('sTotal').textContent = '฿' + baht(t.total);
  $('saveSale').disabled = !cart.length;
}
function saveCart() { lsSet('-cart', cart); }
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.cat) { cat = t.dataset.cat; renderCats(); }
  else if (t.dataset.add) { const p = catalog[+t.dataset.add]; addLine(p.name, p.v || '', p.price); }
  else if (t.dataset.q) { const l = cart[+t.dataset.q]; l.qty += +t.dataset.d; if (l.qty <= 0) cart.splice(+t.dataset.q, 1); saveCart(); renderCart(); }
  else if (t.dataset.dt) { discType = t.dataset.dt; document.querySelectorAll('[data-dt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dt === discType)); renderCart(); }
  else if (t.dataset.pay) { pay = t.dataset.pay; document.querySelectorAll('[data-pay]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pay === pay)); }
  else if (t.dataset.tab) showTab(t.dataset.tab);
});
document.addEventListener('change', e => { const lp = e.target.closest('[data-lp]'); if (lp) { const v = +String(lp.value).replace(/[^\d.]/g, ''); if (v >= 0) { cart[+lp.dataset.lp].price = v; saveCart(); } renderCart(); } });
$('discVal').addEventListener('input', renderCart);
$('clearCart').addEventListener('click', () => { if (!cart.length) return; cart = []; $('discVal').value = ''; saveCart(); renderCart(); });

function newBillNo() {
  const d = new Date(); const s = ($('seller').value.trim()[0] || 'X').toUpperCase();
  return `SX${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${/[A-Z0-9]/.test(s) ? s : 'T'}`;
}
let ship = 'รับเอง';
function setShip(v) {
  ship = v;
  document.querySelectorAll('[data-ship]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ship === v));
  const send = v !== 'รับเอง';
  $('addrWrap').hidden = !send; $('pcWrap').hidden = !send;
  $('shipHint').textContent = send ? `ส่ง ${v} · กรอกให้ครบทุกช่อง ใช้พิมพ์ใบปะหน้า` : 'ข้อมูลลูกค้า (ไม่บังคับ)';
}
document.addEventListener('click', e => { const b = e.target.closest('[data-ship]'); if (b) setShip(b.dataset.ship); });

let saving = false;
$('saveSale').addEventListener('click', async () => {
  if (!cart.length || saving) return;
  const seller = $('seller').value.trim();
  if (!seller) { toast('ใส่ชื่อคนขายก่อน'); $('seller').focus(); return; }

    const miss = [['cust', 'ชื่อผู้รับ'], ['custPhone', 'เบอร์โทร'], ['addr', 'ที่อยู่'], ['postcode', 'รหัสไปรษณีย์']].find(([id]) => !$(id).value.trim());

// ---------- sync ----------
async function syncOne(s) {
  if (s.synced || !pin) return false;
  try { await rpc('record_sale', { p_pin: pin, p_sale: s }); s.synced = true; lsSet('-sales', sales); return true; }
  catch (e) { if (e.pin) { pin = ''; lsSet('-pin', ''); showPin('PIN เปลี่ยนแล้ว ใส่ PIN ใหม่จาก Bay'); } return false; }
}
let syncing = false;
async function syncAll() {
  if (syncing) return; syncing = true;
  for (const s of sales.filter(x => !x.synced)) { if (!(await syncOne(s))) break; }
  syncing = false; renderSales(); setMode();
}
window.addEventListener('online', syncAll);
setInterval(syncAll, 30000);
$('syncNow').addEventListener('click', syncAll);
function setMode() {
  const m = $('mode'); const n = sales.filter(s => !s.synced).length;
  if (!navigator.onLine) { m.className = 'mode warn'; m.textContent = 'ออฟไลน์ · เก็บไว้ในเครื่องก่อน'; }
  else if (n) { m.className = 'mode warn'; m.textContent = `รอส่ง ${n} บิล`; }
  else { m.className = 'mode ok'; m.textContent = 'บันทึกเข้าระบบแล้ว'; }
}

// ---------- receipt ----------
function receiptHtml(s) {
  return `<div class="receipt num">
    <div class="ln"><b style="font-weight:500">CHAW CHER · ${esc(s.no)}</b><span>${new Date(s.at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })}</span></div>
    ${s.items.map(l => `<div class="ln"><span>${esc(l.name)}${l.v ? ' · ' + esc(l.v) : ''} × ${l.qty}</span><span>฿${baht(l.price * l.qty)}</span></div>`).join('')}
    <div class="ln" style="border-top:1px solid var(--line);padding-top:4px"><span>รวม</span><span>฿${baht(s.subtotal)}</span></div>
    ${s.discount ? `<div class="ln"><span>ส่วนลด${s.discountType === 'pct' ? ' ' + s.discountValue + '%' : ''}</span><span>−฿${baht(s.discount)}</span></div>` : ''}
    <div class="ln" style="font-size:18px;color:var(--navy)"><b style="font-weight:500">ยอดสุทธิ</b><b style="font-weight:500">฿${baht(s.total)}</b></div>
    <div class="ln muted"><span>ชำระ: ${esc(s.pay)} · คนขาย: ${esc(s.seller)}</span></div>
    <div class="muted">รับสินค้า: ${esc(s.ship || 'รับเอง')}</div>
    ${s.customer || s.phone ? `<div class="muted">ลูกค้า: ${esc(s.customer)} ${esc(s.phone)}</div>` : ''}
    ${s.address ? `<div class="muted">ที่อยู่: ${esc(s.address)} ${esc(s.postcode)}</div>` : ''}
    ${s.note ? `<div class="muted">หมายเหตุ: ${esc(s.note)}</div>` : ''}
  </div>`;
}
function receiptText(s) {
  const L = [`CHAW CHER · ใบเสร็จ ${s.no}`, new Date(s.at).toLocaleString('th-TH')];
  s.items.forEach(l => L.push(`${l.name}${l.v ? ' ' + l.v : ''} x${l.qty}  ฿${baht(l.price * l.qty)}`));
  if (s.discount) L.push(`ส่วนลด −฿${baht(s.discount)}`);
  L.push(`ยอดสุทธิ ฿${baht(s.total)} (${s.pay})`);
  if (s.ship && s.ship !== 'รับเอง') L.push(`จัดส่ง ${s.ship}: ${s.customer} ${s.phone}`, `${s.address} ${s.postcode}`);
  L.push('ขอบคุณครับ · CHAW CHER');
  return L.join('\n');
}
function openReceipt(s) {
  // ★ บิลที่ยกเลิกจากหลังบ้านแล้ว ส่งให้ลูกค้าไม่ได้ · ซ่อนปุ่มคัดลอกไปเลย
  //   ไม่งั้นวันหนึ่งจะมีคนก็อปใบเสร็จของบิลที่ยกเลิกไปแล้วส่งลูกค้า
  const void_ = s.status === 'ยกเลิก';
  const msg = void_ ? '<span class="tag bad">ยกเลิกแล้ว</span>'
            : s.synced ? '<span class="tag">บันทึกเข้าระบบแล้ว</span>'
            : '<span class="tag warn">เก็บในเครื่องก่อน · ระบบจะส่งให้เองเมื่อมีเน็ต</span>';
  $('dlgBody').innerHTML = `<div class="row" style="justify-content:space-between"><h3>ใบเสร็จ</h3>${msg}</div>${receiptHtml(s)}
    <div class="row"><button class="btn" id="dClose">ปิด</button>${void_ ? '' : '<button class="btn ghost" id="dCopy">คัดลอกส่งลูกค้า</button>'}</div>
    <p class="muted">${void_ ? 'บิลนี้ถูกยกเลิกจากหลังบ้านแล้ว ส่งให้ลูกค้าไม่ได้' : 'กดผิด? แจ้ง Bay ให้แก้หรือยกเลิกบิล ' + esc(s.no) + ' จากหลังบ้าน'}</p>`;
  $('dClose').onclick = () => $('dlg').close();
  if (!void_) $('dCopy').onclick = () => copy(receiptText(s));
  if (!$('dlg').open) $('dlg').showModal();
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); } catch { toast('คัดลอกไม่ได้ในเบราว์เซอร์นี้'); } }

// ---------- sales view ----------
// บิลของวันที่เลือก มาจากสองที่รวมกัน
//   · ฐานข้อมูล  = ทุกเครื่องของงาน · ย้อนหลังได้ทุกวัน (ต้องมี PIN และมีเน็ต)
//   · ในเครื่อง  = บิลที่เพิ่งขายและยังไม่ได้ส่ง · จะได้ไม่หายจากจอตอนเน็ตหลุด
// ฐานข้อมูลชนะเมื่อ id ซ้ำกัน เพราะยอดถูกคำนวณใหม่ที่ฝั่งนั้นเสมอ
let viewDate = localDate();
const dayCache = {};     // 'YYYY-MM-DD' -> บิลจากฐานข้อมูล
let dayList = [];        // สิ่งที่อยู่บนจอตอนนี้ · ปุ่ม ดู/คัดลอก หาจากตรงนี้

function itemsShort(s) { return s.items.map(l => `${l.name}${l.v ? ' ' + l.v : ''}${l.qty > 1 ? ' ×' + l.qty : ''}`).join(', '); }
function thDate(d) {
  const [y, m, dd] = d.split('-').map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
}
function shiftDate(d, n) {
  const [y, m, dd] = d.split('-').map(Number);
  const x = new Date(y, m - 1, dd + n);
  return localDate(x);
}
function mergeDay(d) {
  const byId = new Map();
  (dayCache[d] || []).forEach(s => byId.set(s.id, s));
  sales.filter(s => s.date === d).forEach(s => { if (!byId.has(s.id)) byId.set(s.id, s); });
  return [...byId.values()].sort((a, b) => String(b.at).localeCompare(String(a.at)));
}
async function loadDay(d) {
  if (!pin || !navigator.onLine) return false;
  try { dayCache[d] = (await rpc('list_sales', { p_pin: pin, p_date: d })) || []; return true; }
  catch (e) { if (e.pin) { pin = ''; lsSet('-pin', ''); showPin('PIN เปลี่ยนแล้ว ใส่ PIN ใหม่จาก Bay'); } return false; }
}
async function goDate(d) {
  viewDate = d;
  $('dDate').value = d;
  renderSales();                 // วาดของในเครื่องก่อน จะได้ไม่ค้างรอเน็ต
  if (!(viewDate in dayCache)) { await loadDay(d); renderSales(); }
}
function renderSales() {
  const list = dayList = mergeDay(viewDate);
  const live = list.filter(s => s.status !== 'ยกเลิก');
  const sum = live.reduce((a, s) => a + Number(s.total), 0);
  const by = (p) => live.filter(s => s.pay === p).reduce((a, s) => a + Number(s.total), 0);
  const today = viewDate === localDate();

  $('salesTitle').textContent = today ? 'บิลวันนี้' : 'บิลวันที่ ' + thDate(viewDate);
  $('salesSrc').textContent = (viewDate in dayCache)
    ? 'ทุกเครื่องรวมกัน'
    : 'เฉพาะเครื่องนี้ · ใส่ PIN และต่อเน็ตเพื่อดูของทุกเครื่อง';

  $('kpis').innerHTML = `<div class="kpi"><span>ยอดสุทธิ</span><b>฿${baht(sum)}</b></div><div class="kpi"><span>จำนวนบิล</span><b>${live.length}</b></div>
    <div class="kpi"><span>โอน / QR</span><b>฿${baht(by('โอน'))}</b></div><div class="kpi"><span>เงินสด · บัตร</span><b>฿${baht(by('เงินสด'))} · ${baht(by('บัตร'))}</b></div>`;

  $('salesBody').innerHTML = list.length ? list.map(s => {
    const void_ = s.status === 'ยกเลิก';
    const tag = void_ ? '<span class="tag bad">ยกเลิก</span>'
              : s.synced ? '<span class="tag">ส่งแล้ว</span>' : '<span class="tag warn">รอส่ง</span>';
    return `<tr${void_ ? ' class="void"' : ''} data-view="${esc(s.id)}" style="cursor:pointer"><td>${esc(s.no)}</td><td>${new Date(s.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</td><td>${esc(itemsShort(s))}</td><td class="r">฿${baht(s.total)}</td><td>${esc(s.pay)}</td><td>${tag}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn ghost small" data-view="${esc(s.id)}">ดู</button>${void_ ? '' : `<button class="btn ghost small" data-copy="${esc(s.id)}">คัดลอก</button>`}</div></td></tr>`;
  }).join('')
    : `<tr><td colspan="7" class="muted" style="padding:16px 6px">${today ? 'วันนี้ยังไม่มีบิล' : 'วันที่ ' + esc(thDate(viewDate)) + ' ไม่มีบิล'}</td></tr>`;

  const n = sales.filter(s => !s.synced).length;
  $('syncBox').hidden = !n;
  $('syncMsg').textContent = n ? `${n} บิลยังไม่เข้าระบบ (เน็ตหลุดหรือยังไม่ใส่ PIN) · บิลยังอยู่ในเครื่อง ไม่หาย · ระบบลองส่งให้ทุก 30 วินาที` : '';
  setMode();
}
document.addEventListener('click', e => {
  // ★ ต้องเช็ค data-copy ก่อน เพราะปุ่มคัดลอกอยู่ในแถวที่มี data-view
  //   ไม่งั้นกดคัดลอกแล้วจะไปเปิดใบเสร็จแทน
  const c = e.target.closest('[data-copy]');
  if (c) { const s = dayList.find(x => x.id === c.dataset.copy); if (s) copy(receiptText(s)); return; }
  const v = e.target.closest('[data-view]');
  if (v) { const s = dayList.find(x => x.id === v.dataset.view) || sales.find(x => x.id === v.dataset.view); if (s) openReceipt(s); }
});
$('dDate').addEventListener('change', () => { if ($('dDate').value) goDate($('dDate').value); });
$('dPrev').addEventListener('click', () => goDate(shiftDate(viewDate, -1)));
$('dNext').addEventListener('click', () => goDate(shiftDate(viewDate, 1)));
$('dToday').addEventListener('click', () => goDate(localDate()));

// ---------- PIN ----------
function showPin(msg) { $('pinBox').hidden = false; $('pinErr').textContent = msg || ''; setTimeout(() => $('pinIn').focus(), 50); }
$('pinForm').addEventListener('submit', async e => {
  e.preventDefault(); const p = $('pinIn').value.trim(); $('pinErr').textContent = 'กำลังตรวจ…';
  try { const ok = await rpc('check_pin', { p_pin: p }); if (ok === true) { pin = p; lsSet('-pin', p); $('pinBox').hidden = true; $('pinIn').value = ''; syncAll(); loadDay(viewDate).then(ok => { if (ok) renderSales(); }); toast('พร้อมขายแล้ว'); } else $('pinErr').textContent = 'PIN ไม่ถูกต้อง'; }
  catch { $('pinErr').textContent = 'ต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'; }
});

// ---------- tabs & boot ----------
function showTab(t) {
  ['sell', 'sales'].forEach(k => { $('v-' + k).hidden = k !== t; });
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  if (t === 'sales') { renderSales(); if (!(viewDate in dayCache)) loadDay(viewDate).then(ok => { if (ok) renderSales(); }); }
}
$('dDate').value = viewDate;
renderCats(); renderCart(); renderSales();
if (!pin) showPin(); else syncAll();
</script>
</body>
</html>
